var PATTERNS=[
{p:"I would like to…",m:"Polite way to say what you want.",s:"I would like to + verb / I'd like + noun",ex:["I would like to open an account.","I'd like to book an appointment.","I'd like a coffee, please."],trap:"« Je voudrais » ≠ \"I want\" (too direct). Default to I'd like.",q:{q:"The polite version of \"I want an appointment\":",o:["I would like an appointment.","I am wanting an appointment.","Give me an appointment.","I like an appointment."],b:0,x:"I'd like = polite want."}},
{p:"I'm looking for…",m:"Say what you're searching for.",s:"I'm looking for + noun",ex:["I'm looking for a two-bedroom apartment.","I'm looking for a full-time job.","We're looking for a family doctor."],trap:"Never \"I search a job\" — LOOK FOR is the everyday verb.",q:{q:"« Je cherche un emploi » =",o:["I'm looking for a job.","I search a job.","I look a job.","I'm searching job."],b:0,x:"LOOK FOR — never forget the FOR."}},
{p:"Would you mind…?",m:"Extra-polite request.",s:"Would you mind + verb-ING…?",ex:["Would you mind repeating that?","Would you mind closing the window?","Would you mind waiting a moment?"],trap:"Verb takes -ING! And to say yes, answer \"Not at all!\" (= no problem).",q:{q:"\"Would you mind ___ that email again?\"",o:["sending","to send","send","sent"],b:0,x:"Would you mind + -ING: sending."}},
{p:"Could you…?",m:"The standard polite request.",s:"Could you + verb (+ please)?",ex:["Could you send me the form, please?","Could you speak more slowly?","Could you spell that for me?"],trap:"Could is softer than can. Add please — Canadian politeness loves it.",q:{q:"The most natural request:",o:["Could you help me, please?","You help me now.","Can helping me?","Help."],b:0,x:"Could you + please = the winning combo."}},
{p:"Do you mind if…?",m:"Asking permission.",s:"Do you mind if I + verb…?",ex:["Do you mind if I open the window?","Do you mind if I sit here?","Do you mind if I leave early today?"],trap:"\"No, go ahead!\" means YES you can (mind = être dérangé).",q:{q:"\"Do you mind if I sit here?\" — \"Not at all!\" means:",o:["Yes, please sit!","No, you can't.","Stand up.","I don't understand."],b:0,x:"Not at all = it doesn't bother me = go ahead."}},
{p:"I'm wondering if… / I was wondering…",m:"Soft, indirect way to ask.",s:"I was wondering if + subject + verb",ex:["I was wondering if the position is still open.","I'm wondering if you could help me.","I was wondering if we could reschedule."],trap:"The past (\"was wondering\") is MORE polite, not about the past!",q:{q:"The softest way to ask for help:",o:["I was wondering if you could help me.","Help me if you can.","I wonder you help me.","You could help."],b:0,x:"I was wondering if… = velvet-glove English."}},

{p:"I'd better…",m:"Say what you should do (or risk consequences).",s:"I'd better + base verb",ex:["I'd better leave now — the bus is coming.","You'd better call the landlord today.","We'd better double-check the form."],trap:"No TO: I'd better GO. Stronger than \"should\" — there's a consequence.",q:{q:"\"The store closes in 10 minutes.\" →",o:["I'd better hurry!","I'd better to hurry!","I better hurrying!","I would better hurry to!"],b:0,x:"I'd better + base verb = urgent self-advice."}},

];
function renderPatterns(){

  return retour("Learn","goSub(null)")+
  '<div class="sur">English Patterns</div>'+
  '<div class="titre-vue">🧩 The structures natives use every day</div>'+
  '<div class="note">Master these '+PATTERNS.length+' patterns and half of everyday English is yours. Tap one — and ⭐ the ones you want in your Bank.</div>'+
  PATTERNS.map(function(x,i){

{t:"V vs W",icon:"👄",why:"V = teeth on lip (like French). W = round lips, no teeth — 'ouh'. 'Very' ≠ 'wary'.",
 words:["very","well","welcome","view","weekend","available","website","whatever"],
 pairs:[["vest","west"],["vine","wine"],["veil","whale"]]},
{t:"Ending sounds",icon:"🔚",why:"Don't drop final sounds! 'Work' vs 'worked' vs 'works' changes the grammar.",
 words:["worked","works","walked","asked","stopped","watches","hoped","laughed"],
 pairs:[["work","worked"],["walk","walks"],["stop","stopped"]]},
{t:"Word stress",icon:"🥁",why:"English words have a STRONG syllable. Wrong stress = hard to understand: PHOto, phoTOgraphy.",
 words:["important","development","comfortable","interesting","Canadian","opportunity","necessary","communicate"],
 pairs:[["REcord (noun)","reCORD (verb)"],["PREsent (noun)","preSENT (verb)"],["DEsert","desSERT"]]},
{t:"Minimal pairs — vowels",icon:"👂",why:"Ship/sheep, full/fool… tiny vowel changes, big meaning changes. Train your ear!",
 words:["ship","sheep","full","fool","live","leave","sit","seat"],
 pairs:[["ship","sheep"],["live","leave"],["full","fool"]]},
{t:"Canadian rhythm & intonation",icon:"🍁",why:"English is a rhythm language: stress the important words, glide over the small ones. Voice UP for questions, friendly and melodic — very Canadian, eh?",
 words:["How's it going?","No worries at all!","Have a good one!","That sounds great, eh?","I was going to say…","What do you think about it?"],
 pairs:[["You're coming. (statement ↘)","You're coming? (question ↗)"],["Really. (flat)","Really?! (surprised ↗)"],["Thanks. (cold)","Thanks! (warm)"]]}
];
function renderPron(){
  if(S.pronId!==null&&S.pronId!==undefined&&PRON[S.pronId])return renderPronDetail();
  return retour("Learn","goSub(null)")+
  '<div class="sur">Pronunciation Lab</div>'+
  '<div class="titre-vue">🎙️ Sound natural</div>'+
  '<div class="note">'+PRON.length+' stations targeting the exact sounds francophones struggle with. Listen, repeat out loud, then test your ear!</div>'+
  PRON.map(function(p,i){
    return '<div class="carte gcarte" onclick="S.pronId='+i+';S._pearAns=null;S._pearPick=null;render();window.scrollTo(0,0)">'+
    '<div class="gico" style="background:var(--goldL)">'+p.icon+'</div>'+
    '<div class="gtxt"><div class="gtit">'+esc(p.t)+'</div><div class="gdesc">'+esc(p.why.split("!")[0].split(".")[0])+'</div></div>'+
    '<div class="gfle">→</div></div>';
  }).join("");
}
function pronSay(t){speakEn(String(t).replace(/\s*\(.*?\)/g,"").replace(/[↘↗]/g,""));}
function renderPronDetail(){
  var p=PRON[S.pronId];
  return retour("Pronunciation Lab","S.pronId=null;render()")+
  '<div style="background:var(--goldL);border-radius:14px;padding:14px 16px;margin-bottom:12px">'+
  '<div style="font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8a6d12">Pronunciation Lab</div>'+
  '<div style="font-family:var(--police-titre);font-size:1.3rem;font-weight:900;color:var(--marine)">'+p.icon+' '+esc(p.t)+'</div></div>'+
  card('<div class="sur" style="color:var(--rouge)">🚨 Why francophones struggle</div><div style="font-size:.86rem;margin-top:4px">'+esc(p.why)+'</div>')+
  card('<div class="sur">🔊 Listen & repeat out loud</div>'+
  '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">'+
  p.words.map(function(w){
    return '<button onclick="pronSay(\''+esc(w).replace(/'/g,"\\'")+'\')" style="background:#fff;border:1.5px solid var(--or);border-radius:20px;padding:8px 14px;font-size:.84rem;font-weight:700;cursor:pointer;color:var(--marine)">🔊 '+esc(w)+'</button>';
  }).join("")+'</div>'+
  '<div style="font-size:.74rem;color:var(--gris);margin-top:8px">Tap → listen → repeat 3 times out loud. Yes, out loud! 😄</div>')+
  card('<div class="sur">👂 Hear the difference</div>'+
  p.pairs.map(function(pr,pi){
    return '<div style="display:flex;gap:8px;margin-top:8px">'+
    '<button onclick="pronSay(\''+esc(pr[0]).replace(/'/g,"\\'")+'\')" style="flex:1;background:#fff;border:1.5px solid var(--ligne);border-radius:10px;padding:10px;font-size:.84rem;font-weight:700;cursor:pointer">🔊 '+esc(pr[0])+'</button>'+
    '<button onclick="pronSay(\''+esc(pr[1]).replace(/'/g,"\\'")+'\')" style="flex:1;background:#fff;border:1.5px solid var(--ligne);border-radius:10px;padding:10px;font-size:.84rem;font-weight:700;cursor:pointer">🔊 '+esc(pr[1])+'</button></div>';
  }).join(""))+
  card('<div class="sur">🎯 Ear challenge</div>'+
  '<div style="font-size:.84rem;margin:6px 0 10px">Tap play — Nelly says ONE of the two. Which one did you hear?</div>'+
  '<button class="btn btn-marine btn-bloc" onclick="pearPlay()">▶ Play a mystery word</button>'+
  (S._pearAns!==null&&S._pearAns!==undefined?
    '<div style="display:flex;gap:8px;margin-top:10px">'+
    [0,1].map(function(side){
      var pr=PRON[S.pronId].pairs[S._pearIdx];
      var st='background:#fff;border:1.5px solid var(--ligne)';
      if(S._pearPick!==null&&S._pearPick!==undefined){
        if(side===S._pearAns)st='background:var(--vertL);border:1.5px solid var(--vert)';
        else if(side===S._pearPick)st='background:var(--rougeL);border:1.5px solid var(--rouge)';
      }
      return '<button onclick="'+(S._pearPick===null||S._pearPick===undefined?'pearPick('+side+')':'')+'" style="flex:1;'+st+';border-radius:10px;padding:12px;font-size:.86rem;font-weight:800;cursor:pointer">'+esc(pr[side])+'</button>';
    }).join("")+'</div>'+
    (S._pearPick!==null&&S._pearPick!==undefined?'<div style="margin-top:8px;text-align:center;font-weight:800;color:'+(S._pearPick===S._pearAns?'var(--vert)':'var(--rouge)')+'">'+(S._pearPick===S._pearAns?'✅ Great ear!':'💡 Listen again — tap play!')+'</div>':'')
  :''))+
  '<div style="display:flex;gap:8px;margin-top:10px">'+
  (S.pronId>0?'<button class="btn btn-blanc" style="flex:1" onclick="S.pronId--;S._pearAns=null;S._pearPick=null;render();window.scrollTo(0,0)">← Previous</button>':'')+
  (S.pronId<PRON.length-1?'<button class="btn btn-marine" style="flex:1" onclick="S.pronId++;S._pearAns=null;S._pearPick=null;render();window.scrollTo(0,0)">Next →</button>':'')+'</div>';
}
function pearPlay(){
  var prs=PRON[S.pronId].pairs;
  S._pearIdx=Math.floor(Math.random()*prs.length);
  S._pearAns=Math.random()<0.5?0:1;
  S._pearPick=null;
  pronSay(prs[S._pearIdx][S._pearAns]);
  render();
}
function pearPick(side){S._pearPick=side;if(side===S._pearAns)suivi("pron_ear_ok",PRON[S.pronId].t);render();}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════
   ANGLOVIE — 🔗 PHRASAL VERBS · 🧩 WORDS BY CONTEXT
   ═══════════════════════════════════════════════════════════════ */
S.pvId=null;S.pvSub=null;S.wcId=null;

/* ── 🔗 PHRASAL VERBS ────────────────────────────────────────── */
var PV=[
{base:"Get",icon:"🎯",items:[
 ["get up","to leave bed after sleeping","I get up at 6:30 every morning.","'Get up' ≠ 'wake up' — you can wake up but stay in bed!"],
 ["get over","to recover from something difficult","It took months to get over the move.","Also: 'get over' a cold, a breakup, jet lag."],
 ["get along (with)","to have a good relationship","I get along really well with my new coworkers.","Add 'with' + person: 'get along WITH someone'."],
 ["get by","to manage with just enough","We get by on one salary for now.","Not thriving, just managing — very Canadian understatement!"],
 ["get through","to survive or finish something hard","We got through the first winter together.","Also: 'get through' a phone call, a book, a difficult exam."]]},
{base:"Take",icon:"🤲",items:[
 ["take off","(plane) to leave the ground; (clothes) to remove","The flight takes off at 6 a.m.","Also casual: 'I'm gonna take off' = I'm leaving now."],
 ["take over","to assume control of something","She took over the project when the manager left.","Common in workplace English — a leadership word."],
 ["take after","to resemble a family member","She takes after her mother — same sense of humour.","Only for family resemblance, not objects!"],
 ["take up","to start a new hobby or activity","I took up pottery during the winter.","Also: 'take up space/time' = occupy."],
 ["take back","to withdraw a statement; return a purchase","I take back what I said — you were right.","Useful for apologizing or returning items to a store."]]},
{base:"Put",icon:"📥",items:[
 ["put off","to postpone","Don't put off the dentist appointment again!","Very common — procrastination in two words."],
 ["put up with","to tolerate something unpleasant","I can't put up with this noise anymore.","Strong phrase — shows real frustration."],
 ["put together","to assemble or organize","We put together a welcome package for newcomers.","Also: 'put together' furniture, a presentation, a team."],
 ["put on","to wear; to gain (weight)","Put on your coat, it's cold outside.","'Put on weight' is neutral, not rude, in English."],
 ["put down","to write something; to stop holding","Let me put that down in the notes.","Also: 'put down' your phone — very literal too."]]},
{base:"Go",icon:"🚶",items:[
 ["go over","to review something carefully","Let's go over the contract before signing.","Perfect for meetings: 'go over the agenda'."],
 ["go through","to experience something difficult","She's going through a hard time right now.","Also: 'go through' documents, a process, an airport security."],
 ["go on","to continue; to happen","Please, go on — I'm listening.","'What's going on?' = what's happening (very common!)."],
 ["go ahead","to proceed; to give permission","Go ahead, I'll catch up in a minute.","Polite way to give the green light."],
 ["go without","to manage without something","We went without a car for the first year.","Shows resilience/thriftiness — common newcomer story!"]]},
{base:"Come",icon:"🚪",items:[
 ["come across","to find by chance; to seem/appear","I came across your resume online.","Also: 'come across as' + adjective = give an impression."],
 ["come up with","to think of an idea or solution","She came up with a great idea for the event.","A go-to workplace phrase for creativity."],
 ["come along","to accompany; to make progress","Come along, we're leaving!","Also: 'How's the project coming along?' = progressing."],
 ["come back","to return","When are you coming back to the office?","Simple, everyday, essential."],
 ["come down with","to start being sick with","I think I'm coming down with a cold.","The polite, common way to announce you're getting sick."]]},
{base:"Look",icon:"👀",items:[
 ["look after","to take care of","Can you look after my dog this weekend?","Same meaning as 'take care of', more casual."],
 ["look into","to investigate","I'll look into the refund policy for you.","A customer-service classic."],
 ["look forward to","to anticipate with pleasure","I look forward to hearing from you.","Remember: + -ING! (hearING, not hear)."],
 ["look up","to search for information","Let me look up the address.","Also: 'things are looking up' = improving!"],
 ["look down on","to consider someone inferior","Never look down on someone learning a new language.","A strong, judgmental phrase — use carefully."]]},
{base:"Turn",icon:"🔄",items:[
 ["turn down","to refuse an offer; to lower volume","I had to turn down the extra shift.","Polite refusal word — very useful for boundaries."],
 ["turn out","to result in a particular way","The interview turned out better than expected.","'It turns out that…' = it appears that (great starter)."],
 ["turn up","to arrive, often unexpectedly; increase volume","She turned up ten minutes late.","Also: 'turn up the heat' = increase."],
 ["turn into","to become or change into","The small business turned into a big company.","Transformation word — very versatile."],
 ["turn off/on","to stop/start a device","Turn off your phone during the exam.","Basic but essential everyday phrasal verb."]]},
{base:"Bring",icon:"🎁",items:[
 ["bring up","to mention a topic; to raise a child","She brought up the schedule conflict politely.","Also: 'bring up children' = raise."],
 ["bring back","to return something; to remind of","This song brings back memories.","Emotional, nostalgic use is very common."],
 ["bring about","to cause something to happen","The new policy brought about real change.","Formal-ish — good for writing and presentations."],
 ["bring down","to reduce; to make sad","The news brought down the whole team's morale.","Also literal: 'bring down' the price."],
 ["bring in","to introduce; to earn money","We brought in a consultant to help.","Also: 'bring in' income — business context."]]}
];
function renderPhrasal(){

  return retour("Learn","goSub(null)")+
  '<div class="sur">Phrasal Verbs</div>'+
  '<div class="titre-vue">🔗 Small words, big meaning</div>'+
  '<div class="note">'+PV.length+' base verbs, '+PV.reduce(function(n,g){return n+g.items.length;},0)+' phrasal verbs used every day in Canada. Tap ☆ to save any to your Bank.</div>'+
  PV.map(function(g,i){
    return '<div class="carte gcarte" onclick="S.pvId='+i+';render();window.scrollTo(0,0)">'+
    '<div class="gico" style="background:var(--tealL,#E3F2F1)">'+g.icon+'</div>'+
    '<div class="gtxt"><div class="gtit">'+esc(g.base)+'</div><div class="gdesc">'+g.items.map(function(x){return x[0];}).join(" · ")+'</div></div>'+
    '<div class="gfle">→</div></div>';

  '<div style="background:#E3F2F1;border-radius:14px;padding:14px 16px;margin-bottom:12px">'+

    '<div style="display:flex;align-items:center;gap:9px">'+

    '<div style="flex:1"><span style="font-family:var(--police-titre);font-weight:800;font-size:1.02rem;color:var(--marine)">'+esc(x[0])+'</span>'+

    '<span onclick="bankTogglePv('+S.pvId+','+ii+')">'+starHtml("phrasal",x[0])+'</span></div>'+
    '<div style="margin-top:8px;padding-left:6px;border-left:3px solid #1A7A7A">'+

  '<div style="display:flex;gap:8px;margin-top:10px">'+

/* ── 🧩 WORDS BY CONTEXT ─────────────────────────────────────── */
var WC=[
{w:"Set",icon:"⚙️",meanings:[
 ["set (verb) — to place or fix","I'll set the table for dinner.","Set a goal, set a date, set the alarm."],
 ["set up — to establish or arrange","We need to set up a meeting with HR.","Set up an account, a business, a device."],
 ["set (adjective) — fixed, unchanging","My schedule is pretty set this week.","'A set price' = fixed, non-negotiable."],
 ["set (noun) — a group of matching things","She bought a new set of dishes.","A TV set; a movie set; a chess set."]]},
{w:"Get",icon:"🎯",meanings:[
 ["get — to receive","I got your email this morning.","Get a call, get a raise, get an idea."],
 ["get — to become","It's getting cold outside.","Get tired, get married, get better."],
 ["get — to understand","I don't get this instruction.","'I get it' = I understand, common and casual."],
 ["get — to arrive","What time do we get there?","'Get home', 'get to work' — arrival."]]},
{w:"Take",icon:"🤲",meanings:[
 ["take — to grab or hold","Take my hand, it's slippery.","Physical action, the base meaning."],
 ["take — a duration","The bus takes 40 minutes.","'It takes time' = requires time."],
 ["take — to accept/tolerate","I can't take this stress anymore.","Also: 'take a joke', 'take criticism'."],
 ["take — to attend/enroll in","I'm taking an English class this term.","Take a course, take an exam."]]},
{w:"Make",icon:"🛠️",meanings:[
 ["make — to create","She made a great presentation.","Make food, make a plan, make a decision."],
 ["make — to force/cause","This makes me nervous.","'Make someone do something' = force."],
 ["make — to earn","He makes a good salary.","'Make money', 'make a living'."],
 ["make it — to succeed / arrive in time","We made it to the meeting on time!","A very common everyday expression."]]},
{w:"Do",icon:"✋",meanings:[
 ["do — general actions (no specific object)","What do you do for a living?","Do homework, do the dishes, do exercise."],
 ["do — to be sufficient","This will do for now.","'That'll do' = that's enough."],
 ["do — auxiliary for questions/negatives","Do you speak French?","Grammar helper, not a 'real' verb meaning here."],
 ["make vs do — the classic confusion","We MAKE a decision, but we DO our homework.","Fixed collocations — memorize them in pairs, not rules!"]]},
{w:"Work",icon:"💼",meanings:[
 ["work (verb) — to have a job / function","I work at the hospital downtown.","Also: 'the plan worked' = it succeeded."],
 ["work (noun) — employment, or a task","I have a lot of work today.","Countable? No! 'Works' as a noun is different (art, engineering)."],
 ["work out — to exercise; to succeed","I work out three times a week.","Also: 'it worked out fine' = ended well."],
 ["work on — to improve/develop something","I'm working on my pronunciation.","Perfect for talking about learning goals!"]]},
{w:"Job",icon:"🧳",meanings:[
 ["job — a specific position of employment","I'm looking for a part-time job.","Countable: 'a job', 'two jobs'."],
 ["job vs work — the difference","I have a new job, but I have a lot of work.","Job = the position; Work = the tasks/effort."],
 ["do a good job — to perform well","You did a great job on this report!","A very common compliment phrase."],
 ["odd jobs — small, varied tasks","He does odd jobs around the neighbourhood.","Not one profession — a mix of small tasks."]]},
{w:"Leave / Live",icon:"🏡",meanings:[
 ["leave — to depart","I leave for work at 8 a.m.","Also: 'leave someone alone', 'leave a message'."],
 ["live — to reside; to be alive","I live in a two-bedroom apartment.","Pronounced differently as an adjective! (live music = /laɪv/)"],
 ["leave vs live — the classic mix-up","I LIVE in Toronto, but I LEAVE the house at 7.","One letter apart, totally different meaning — listen carefully!"],
 ["leave (noun) — permission or vacation","She's on parental leave.","'Sick leave', 'maternity leave' — HR vocabulary."]]},
{w:"Look for / Search",icon:"🔍",meanings:[
 ["look for — to try to find (everyday)","I'm looking for my keys.","The natural, spoken version."],
 ["search (for) — more formal or systematic","Police searched the building.","Also: 'search online' — technology context."],
 ["look for a job — job hunting","I've been looking for a job since March.","The standard way to say job-hunting."],
 ["search vs look for","'Search' feels more thorough/official; 'look for' is casual and common.","Use LOOK FOR in daily conversation — it's more natural."]]},
{w:"Attend / Assist",icon:"🙋",meanings:[
 ["attend — to be present at (a false friend trap!)","I will attend the meeting tomorrow.","≠ French 'attendre' (to wait)! Big trap for francophones."],
 ["assist — to help (more formal than 'help')","The nurse assisted the doctor during surgery.","≠ French 'assister à' (to attend)! Reverse false friend."],
 ["the double trap","'Assister à une réunion' = ATTEND a meeting (not 'assist')","Memorize this pair together — it's the #1 francophone mix-up."],
 ["help — the everyday word","Can you help me with this form?","Simplest and safest choice in daily speech."]]},
{w:"Issue / Problem",icon:"⚠️",meanings:[
 ["issue — a matter of concern (softer, professional)","We're having a technical issue.","Common in workplace and customer service English."],
 ["problem — direct, everyday","There's a problem with my order.","Slightly more direct/blunt than 'issue'."],
 ["issue (verb) — to officially give","The bank issued a new card.","Formal: issue a statement, a warning, a refund."],
 ["no issues / no problem — reassurance","No issues on my end!","Common in email sign-offs and quick replies."]]},
{w:"Actually / Currently",icon:"⏰",meanings:[
 ["actually — in fact (a HUGE false friend!)","Actually, the meeting was moved to Friday.","≠ French 'actuellement' (currently)! Classic trap."],
 ["currently — at this moment (this is 'actuellement'!)","I'm currently working on the report.","This is the word French speakers actually need."],
 ["the trap explained","'Actuellement' in French = 'Currently' in English, NOT 'Actually'.","Say this trap out loud 3 times — it saves real confusion at work!"],
 ["actually — softening disagreement","Actually, I think we should wait.","Polite way to introduce a correction or different opinion."]]},
{w:"Support / Assist / Help",icon:"🤝",meanings:[
 ["help — everyday, all-purpose","Can you help me carry this?","Use this by default — always safe."],
 ["support — to back someone emotionally/practically","My family supported me through the move.","Also: 'customer support', 'IT support' — professional context."],
 ["assist — formal helping (often with a task)","The assistant helps— sorry, ASSISTS clients with forms.","More formal register — good for job titles."],
 ["support vs help — the nuance","'Support' often implies ongoing/emotional; 'help' can be a one-time action.","Both are correct — 'support' just sounds warmer and longer-term."]]}
];
function renderWordsContext(){
  if(S.wcId!==null&&S.wcId!==undefined&&WC[S.wcId])return renderWcDetail();
  return retour("Learn","goSub(null)")+
  '<div class="sur">Words by Context</div>'+
  '<div class="titre-vue">🧩 Same word, different meaning</div>'+
  '<div class="note">'+WC.length+' tricky words that change meaning depending on context — including the classic francophone false friends.</div>'+
  WC.map(function(w,i){
    return '<div class="carte gcarte" onclick="S.wcId='+i+';render();window.scrollTo(0,0)">'+

<script>
/* ═══════════════════════════════════════════════════════════════
   ANGLOVIE — THE ROADMAP FINALE
   🧲 Collocations · 🆚 Confusing Words · 🍁 Canada Survival Kit
   ═══════════════════════════════════════════════════════════════ */
S.colId=null;S.cwId=null;S.skId=null;S.skStep=0;

/* ── 🧲 COLLOCATIONS ─────────────────────────────────────────── */
var COL=[
{cat:"Work & Decisions",icon:"💼",items:[
 ["make a decision","She had to make a decision quickly.","NOT 'take a decision' — a classic francophone trap!"],
 ["take responsibility","He took responsibility for the mistake.","NOT 'take the responsibility' — no article here."],
 ["meet expectations","The report didn't meet expectations.","Formal, workplace-standard phrase."],
 ["raise awareness","The campaign aims to raise awareness.","'Raise', not 'rise' — raise is transitive!"],
 ["reach a conclusion","After the review, we reached a conclusion.","'Reach', not 'arrive at' (though that works too)."]]},
{cat:"Everyday Life",icon:"🏙️",items:[
 ["catch a bus","I need to catch the 8 o'clock bus.","'Catch' for buses/trains — 'take' works too, but 'catch' is more natural for a specific time."],
 ["heavy traffic","There's heavy traffic on the highway today.","NOT 'big traffic' — heavy is the word."],
 ["strong coffee","I like my coffee strong in the morning.","NOT 'hard coffee' — strong for taste/intensity."],
 ["highly recommended","This restaurant is highly recommended.","NOT 'strongly recommended' for this context."],
 ["run errands","I have to run a few errands after work.","The natural way to say 'do small tasks outside'."]]},
{cat:"Feelings & Opinions",icon:"💬",items:[
 ["strongly believe","I strongly believe this is the right choice.","NOT 'hardly believe' — different meaning entirely!"],
 ["deeply grateful","We are deeply grateful for your support.","'Deeply', not 'deep' — adverb before adjective."],
 ["fully aware","I'm fully aware of the risks.","NOT 'totally aware' — 'fully' is the natural pairing."],
 ["completely different","The two proposals are completely different.","Common intensifier pairing."],
 ["closely related","The two issues are closely related.","NOT 'near related' — closely is the collocate."]]},
{cat:"Time & Effort",icon:"⏳",items:[
 ["spend time","I spent a lot of time preparing this.","NOT 'pass time' for this meaning (that means something else)."],
 ["waste time","Don't waste time on that — it's not worth it.","The opposite of 'spend time' wisely."],
 ["save time","This shortcut will save us time.","'Save', not 'economize' time in English."],
 ["put in the effort","She really put in the effort this quarter.","Very natural workplace praise phrase."],
 ["take your time","No rush — take your time.","A warm, reassuring everyday phrase."]]}
];
function renderCollocations(){
  if(S.colId!==null&&S.colId!==undefined&&COL[S.colId])return renderColDetail();
  return retour("Learn","goSub(null)")+
  '<div class="sur">Collocations</div>'+
  '<div class="titre-vue">🧲 Words that stick together</div>'+
  '<div class="note">English word pairs that just "go together" — get them wrong and you sound unnatural, even if grammatically correct.</div>'+
  COL.map(function(c,i){
    return '<div class="carte gcarte" onclick="S.colId='+i+';render();window.scrollTo(0,0)">'+
    '<div class="gico" style="background:var(--ieltsL,#E8F4F8)">'+c.icon+'</div>'+
    '<div class="gtxt"><div class="gtit">'+esc(c.cat)+'</div><div class="gdesc">'+c.items.map(function(x){return x[0];}).slice(0,3).join(" · ")+'…</div></div>'+
    '<div class="gfle">→</div></div>';
  }).join("");
}
function bankToggleCol(ci,ii){var x=COL[ci].items[ii];bankToggle("collocation",x[0],x[1]);}

  '<div style="display:flex;gap:8px;margin-top:10px">'+

/* ── 🆚 CONFUSING WORDS ──────────────────────────────────────── */
var CW=[
{a:"Say",b:"Tell",icon:"🗣️",rule:"TELL needs a person right after it. SAY does not.",
 ex:["She said hello. (no person right after)","She told me hello. (person: 'me')","Tell me the truth.","Say something!"],
 wrong:"❌ She said me hello. → ✅ She told me hello."},
{a:"Work",b:"Job",icon:"💼",rule:"JOB is a specific position (countable). WORK is the general activity or effort (uncountable).",
 ex:["I have a new job at the hospital.","I have a lot of work to do today.","She's looking for a job.","This project needs more work."],
 wrong:"❌ I have a new work. → ✅ I have a new job."},
{a:"Do",b:"Make",icon:"🛠️",rule:"DO = general activities/tasks. MAKE = creating or producing something.",
 ex:["I do my homework every evening.","I make dinner for the family.","She does the dishes.","He makes decisions quickly."],
 wrong:"❌ I make my homework. → ✅ I do my homework."},
{a:"Bring",b:"Take",icon:"🎁",rule:"BRING = toward the speaker/here. TAKE = away from the speaker/there.",
 ex:["Bring your ID to the interview. (to that place)","Take your umbrella with you. (away from here)","Can you bring me some water? (to me)","I'll take the documents to the office. (away)"],
 wrong:"❌ Bring this to the office when you leave. → ✅ Take this to the office when you leave."},
{a:"Hear",b:"Listen",icon:"👂",rule:"HEAR = sounds reach your ears passively. LISTEN = active attention, and needs 'to' + object.",
 ex:["I hear music from next door.","I'm listening to the radio.","Did you hear that noise?","Listen to me carefully."],
 wrong:"❌ I'm listening music. → ✅ I'm listening TO music."},
{a:"See / Watch / Look",b:"",icon:"👀",rule:"SEE = passive (it just appears). WATCH = active, for moving things (TV, sports). LOOK (AT) = deliberate, brief attention.",
 ex:["I see a bird outside.","I'm watching a movie tonight.","Look at this photo!","I watched the whole game."],
 wrong:"❌ I'm seeing TV right now. → ✅ I'm watching TV right now."},
{a:"Borrow",b:"Lend",icon:"🔄",rule:"BORROW = you take/receive. LEND = you give/provide. Opposite directions!",
 ex:["Can I borrow your pen?","Can you lend me your pen?","I borrowed money from my brother.","He lent me his car for the weekend."],
 wrong:"❌ Can you borrow me your pen? → ✅ Can you lend me your pen?"},
{a:"Since",b:"For",icon:"⏱️",rule:"SINCE + a specific point in time (2020, Monday, last year). FOR + a duration (3 years, two weeks).",
 ex:["I've lived here since 2022.","I've lived here for three years.","She's worked there since January.","He's been studying for two hours."],
 wrong:"❌ I've lived here since three years. → ✅ I've lived here for three years."},
{a:"Yet",b:"Already",icon:"⏳",rule:"YET = negative/questions, means 'up to now' (goes at the end). ALREADY = positive sentences, means 'before now/sooner than expected'.",
 ex:["I haven't finished yet.","Have you eaten yet?","I've already finished the report.","She's already left for the airport."],
 wrong:"❌ I have already finish yet. → ✅ I haven't finished yet. / I've already finished."},
{a:"Affect",b:"Effect",icon:"⚡",rule:"AFFECT is (usually) a verb — to influence. EFFECT is (usually) a noun — the result.",
 ex:["The weather affects my mood.","The medication had a positive effect.","Stress can affect your health.","We saw the effects of the policy."],
 wrong:"❌ The effect of the noise affects me. → ✅ The noise affects me. / The effect of the noise is clear."}
];
function renderConfusing(){
  if(S.cwId!==null&&S.cwId!==undefined&&CW[S.cwId])return renderCwDetail();

  '<div class="sur">Confusing Words</div>'+

    return '<div class="carte gcarte" onclick="S.cwId='+i+';render();window.scrollTo(0,0)">'+
    '<div class="gico" style="background:var(--rougeL)">'+c.icon+'</div>'+
    '<div class="gtxt"><div class="gtit">'+esc(c.a)+(c.b?' vs '+esc(c.b):'')+'</div><div class="gdesc">'+esc(c.rule.split(".")[0])+'.</div></div>'+
    '<div class="gfle">→</div></div>';

}
function renderCwDetail(){

  '<div style="font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--rouge)">Confusing Words</div>'+

  '<button class="btn btn-or btn-bloc" onclick="goTab(\'coach\');coachPush(\'Let\\\'s practice &quot;'+esc(c.a)+(c.b?" vs "+esc(c.b):"")+'&quot;. Give me 4 sentences with a blank where I choose the correct word, one at a time, and correct my answers.\')">🤖 Practice with Coach AngloVie</button>'+
  '<div style="display:flex;gap:8px;margin-top:10px">'+
  (S.cwId>0?'<button class="btn btn-blanc" style="flex:1" onclick="S.cwId--;render();window.scrollTo(0,0)">← Previous</button>':'')+
  (S.cwId<CW.length-1?'<button class="btn btn-marine" style="flex:1" onclick="S.cwId++;render();window.scrollTo(0,0)">Next →</button>':'')+'</div>';
}

/* ── 🍁 CANADA SURVIVAL KIT ──────────────────────────────────── */
var SK=[
{t:"Open a bank account",icon:"🏦",vocab:[["a void cheque","a blank cheque used to set up direct deposit"],["a SIN (Social Insurance Number)","required to open most accounts"],["overdraft protection","a safety net if you spend more than you have"],["direct deposit","automatic payment into your account"],["a debit card","for everyday purchases, linked to your account"]],
 dialogue:[["Agent","Hi, welcome! Are you looking to open a new account today?"],["You","Yes, I just moved to Canada and I'd like a chequing account."],["Agent","Great, do you have your SIN and a piece of ID with you?"],["You","Yes, here's my passport and my SIN letter."],["Agent","Perfect. Would you also like a savings account or a credit card?"]]},
{t:"Rent an apartment",icon:"🏠",vocab:[["a lease","the rental contract, usually 12 months"],["first and last month's rent","common deposit requirement"],["utilities included / extra","check what's covered (heat, water, electricity)"],["a landlord / a tenant","the owner / the renter"],["a reference letter","proof from a previous landlord or employer"]],
 dialogue:[["Landlord","Hi, thanks for coming to see the apartment."],["You","Thank you for having me. Is heating included in the rent?"],["Landlord","Yes, heating and water are included. Electricity is extra."],["You","Great. What would I need to apply?"],["Landlord","A credit check, proof of income, and two references."]]},
{t:"Visit a doctor",icon:"🏥",vocab:[["a family doctor / a walk-in clinic","regular doctor vs. no-appointment clinic"],["a health card (OHIP)","your provincial health insurance card"],["a referral","needed to see a specialist"],["symptoms","what you're feeling (pain, fever, cough…)"],["a prescription","for medication from the pharmacy"]],
 dialogue:[["Receptionist","Good morning, do you have an appointment?"],["You","No, I don't have a family doctor yet — is this a walk-in clinic?"],["Receptionist","Yes it is. Can I see your health card, please?"],["You","I just arrived, I don't have one yet — is that a problem?"],["Receptionist","No problem, we can still see you today. Please have a seat."]]},
{t:"Call Service Canada",icon:"📞",vocab:[["Service Canada","federal services: SIN, EI, pension, passports"],["EI (Employment Insurance)","benefits if you lose your job"],["an appointment / a file number","booking + your case reference"],["hold time","how long you wait on the phone"],["to be transferred","moved to another department/agent"]],
 dialogue:[["Agent","Thank you for calling Service Canada, how can I help you?"],["You","Hi, I'd like to apply for a Social Insurance Number."],["Agent","Sure. Do you have your immigration documents with you?"],["You","Yes, I have my permanent resident card."],["Agent","Perfect, you can apply online or visit a Service Canada office."]]},
{t:"Call ServiceOntario",icon:"🏛️",vocab:[["ServiceOntario","provincial services: driver's licence, health card, ID"],["a G1 / G2 / G licence","Ontario's graduated driving licence levels"],["a knowledge test","the written test to get your G1"],["an appointment booking","many services need one now"],["a wait time","how long until the next available slot"]],
 dialogue:[["Agent","ServiceOntario, how may I assist you?"],["You","Hi, I'd like to book an appointment for my driving test."],["Agent","Sure, are you booking a G1 knowledge test or a road test?"],["You","The G1 knowledge test, please."],["Agent","I have an opening this Thursday at 2 p.m. — does that work?"]]},
{t:"Buy a car / Go to a garage",icon:"🚗",vocab:[["a used car","a second-hand vehicle"],["a safety certificate","required to sell/register a used car"],["a warranty","protection covering repairs"],["an oil change","routine maintenance"],["a quote / an estimate","the expected repair cost"]],
 dialogue:[["Mechanic","Hi there, what can I do for you today?"],["You","My car is making a strange noise when I brake."],["Mechanic","Okay, let's take a look. Could be the brake pads."],["You","How much would that cost, roughly?"],["Mechanic","I'll give you a quote once I've checked — should be ready in an hour."]]},
{t:"Speak with a teacher",icon:"🏫",vocab:[["a parent-teacher meeting","a scheduled conversation about your child's progress"],["report card","the official grades document"],["homework","schoolwork done at home"],["an IEP (Individualized Education Plan)","extra support plan for some students"],["a field trip","a school outing"]],
 dialogue:[["Teacher","Thanks for coming in! Overall, your daughter is doing really well."],["You","That's great to hear. Is there anything she should work on?"],["Teacher","Her reading has improved a lot. Math could use a bit more practice."],["You","Do you have any resources we could use at home?"],["Teacher","Yes, I'll send you a link to some extra worksheets."]]},
{t:"Register a child at school",icon:"📚",vocab:[["proof of address","a utility bill or lease to confirm where you live"],["immunization record","vaccination history required for enrollment"],["birth certificate","required for age verification"],["a school board","the local authority managing schools"],["French Immersion","a program teaching mostly in French"]],
 dialogue:[["Staff","Hello, welcome! Are you registering a new student today?"],["You","Yes, my son is 7 and we just moved to the area."],["Staff","Great, do you have proof of address and his birth certificate?"],["You","Yes, and his immunization record too."],["Staff","Perfect, that's everything we need to get started."]]},
{t:"Visit a daycare",icon:"🧸",vocab:[["a daycare / a licensed daycare","childcare, ideally government-licensed"],["a waitlist","many daycares have long waiting lists — apply early!"],["subsidized childcare","reduced-cost care based on income"],["drop-off / pick-up times","the daily schedule"],["a spot","an available place for a child"]],
 dialogue:[["Staff","Hi, thanks for calling! How can I help?"],["You","Hi, I'd like to ask about availability for my daughter, she's 2."],["Staff","Let me check — we currently have a short waitlist for that age."],["You","How long is the wait usually?"],["Staff","It varies, but I'd recommend applying now to secure your spot."]]}

function renderSurvival(){

function activity(title,desc,icon,action){return '<button class="activity" onclick="'+safeHandler(action)+'"><span class="square" aria-hidden="true">'+icon+'</span><span><strong>'+esc(title)+'</strong><small>'+esc(desc)+'</small></span><span class="arrow" aria-hidden="true">→</span></button>';}
function moduleCard(id){var m=MODULES[id];return activity(m[0],m[1],m[2],"goSub('"+id+"')");}
function render(){var zone=document.getElementById('zone'),nav=document.getElementById('navbas');document.documentElement.lang='en';document.getElementById('aiTop').hidden=!S.profilOk;document.getElementById('profileTop').hidden=!S.profilOk;var body='';if(S.screen==='welcome')body=renderWelcome();else if(S.screen==='profile')body=renderProfile();else if(S.tab==='home')body=renderHome();else if(S.tab==='learn')body=renderLearnHub();else if(S.tab==='missions')body=renderPractice();else if(S.tab==='peer')body=renderPeer();else if(S.tab==='dash')body=renderDash();else if(S.tab==='coach')body=renderCoach();else body=renderHome();zone.innerHTML=body;nav.innerHTML=S.screen==='app'?navBas():'';if(storageFailed)zone.insertAdjacentHTML('afterbegin','<div class="notice" role="status">This device is blocking local saving. Export your progress before closing the app.</div>');enhanceAccessibility();}
function enhanceAccessibility(){document.querySelectorAll('#zone [onclick]:not(button):not(a):not(input):not(select)').forEach(el=>{if(el.querySelector('button,a,input,[onclick]'))return;el.setAttribute('role','button');el.tabIndex=0;el.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();}};});document.querySelectorAll('#zone button').forEach(b=>{if(b.textContent.trim()==='🔊')b.setAttribute('aria-label','Listen in English');});}
function renderWelcome(){return '<div class="onboard"><div class="hero"><span class="badge outline">SILFA · Your English learning journey</span><h1>A little every day.<br>More confident in life.</h1><p>Learn with AngloVie, practise with a peer and move at your own pace. At home, during a break or after work.</p><div class="flex wrap"><button class="btn btn-or" onclick="S.screen=\'profile\';render()">Create my learning plan →</button><button class="btn btn-blanc" onclick="installHelp()">Install the app</button></div></div><div class="grid3" style="margin-top:18px"><div class="carte"><span class="sur">01 · Learn</span><p>Useful vocabulary, clear explanations and exercises.</p></div><div class="carte"><span class="sur">02 · Practise</span><p>Conversations and situations from everyday life.</p></div><div class="carte"><span class="sur">03 · Connect</span><p>Remote peer support, as arranged with your plan.</p></div></div><div class="notice">You can complete your learning journey remotely. Workplace immersion is an optional extra to discuss with UCBH if it fits your goals.</div><p class="muted">Looking for French? FrancoVie is the other language pathway in SILFA. <a href="https://ucbh-london.ca" target="_blank" rel="noopener">Contact UCBH</a></p><p class="footer-note">AngloVie · Created by Nelly Folefack · SILFA programme, UCBH</p></div>';}
function renderProfile(){return '<div class="onboard"><div class="sur">My starting point</div><h1 class="titre-vue">A learning plan that fits me.</h1><p class="note">Learn and practise in English. You can change these choices at any time.</p><form onsubmit="saveProfile(event)"><div class="field"><label for="profileName">My first name or nickname</label><input id="profileName" maxlength="80" required autocomplete="given-name" value="'+esc(S.prenom)+'"></div><div class="field"><label for="profileGoal">My main goal</label><select id="profileGoal">'+[['daily','Feel more confident in everyday life'],['work','Communicate better at work'],['confidence','Start speaking and build confidence']].map(x=>'<option value="'+x[0]+'" '+(S.goal===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div><div class="grid2 compact"><div class="field"><label for="profileLevel">My estimated level</label><select id="profileLevel">'+['A1','A2','B1','B2'].map(n=>'<option '+(S.niveau===n?'selected':'')+'>'+n+'</option>').join('')+'</select><small>A1: beginner · A2: simple conversations · B1: independent · B2: confident.</small></div><div class="field"><label for="profileMinutes">My session length</label><select id="profileMinutes">'+[5,10,15,20].map(n=>'<option value="'+n+'" '+(Number(S.minutes)===n?'selected':'')+'>'+n+' minutes</option>').join('')+'</select></div></div><div class="field"><label for="profileFormat">My preferred support</label><select id="profileFormat"><option value="remote" '+(S.format==='remote'?'selected':'')+'>App and remote support</option><option value="field" '+(S.format==='field'?'selected':'')+'>I would also like to discuss on-site immersion</option></select><small>This does not book a placement. UCBH can help you explore the options.</small></div><p class="muted" style="margin-bottom:18px">Your level is self-assessed. Your preferences and progress are saved on this device. This form does not make a paid registration or booking.</p><button class="btn btn-marine" type="submit">'+(S.profilOk?'Save my preferences':'Start my learning journey')+' →</button> '+(S.profilOk?'<button type="button" class="btn btn-blanc" onclick="S.screen=\'app\';goTab(\'dash\')">Back</button>':'')+'</form></div>';}
function saveProfile(e){e.preventDefault();S.prenom=document.getElementById('profileName').value.trim();if(!S.prenom)return;S.goal=document.getElementById('profileGoal').value;S.niveau=document.getElementById('profileLevel').value;S.minutes=Number(document.getElementById('profileMinutes').value);S.format=document.getElementById('profileFormat').value;S.profilOk=true;S.screen='app';S.tab='home';sauver();render();window.scrollTo(0,0);}
function pathCard(p,i){return '<button class="step-card" onclick="showPath('+i+')"><span class="step-number">STEP '+String(i+1).padStart(2,'0')+(S.pathDone[p.id]?' · ✓ EXPLORED':'')+'</span><h3>'+p.title+'</h3><p>'+p.desc+'</p><span class="foot"><span>'+p.level+'</span><span aria-hidden="true">↗</span></span></button>';}
function renderHome(){var n=Object.keys(S.revDone).length;return '<div class="hero"><div class="hero-layout"><div><span class="badge outline">SILFA · My English, my pace</span><h1>Hello '+esc(S.prenom)+'.<br>What conversation<br>will you try today?</h1><p>Your next step: '+S.minutes+' minutes to learn, practise and build confidence.</p><div class="flex wrap"><button class="btn btn-or" onclick="resumeActivity()">'+(S.lastActivity?'Continue my activity':'Start my learning journey')+' →</button><button class="btn btn-blanc" onclick="goTab(\'peer\')">My peer support</button></div></div><div class="hero-art" aria-hidden="true"><div class="phrase-paper"><small>A phrase to get started</small>Could you say<br>that again?</div><div class="round"></div><div class="phrase-paper second"><small>One step at a time</small>I’m getting<br>more confident.</div></div></div></div><div class="summary"><div><strong>'+n+'</strong><span>lessons explored</span></div><div><strong>'+bankCount()+'</strong><span>saved words and expressions</span></div><div><strong>'+S.joursEtude.length+'</strong><span>practice days</span></div></div><div class="section-line"><h2>Your learning journey</h2><button class="text-button" onclick="goTab(\'learn\')">View the six steps</button></div><div class="grid3">'+[0,2,4].map(i=>pathCard(PATHS[i],i)).join('')+'</div><div class="grid2" style="margin-top:22px"><div class="soft-panel"><span class="sur">Words you can use</span><h2>Your vocabulary, in context.</h2><p>Find a word, listen to it, save it and practise it with your review cards.</p><button class="btn btn-blanc" onclick="goSub(\'vocab\')">Explore vocabulary →</button></div><div class="soft-panel" style="background:#f7efdf"><span class="sur">From the app to conversation</span><h2>Prepare your next conversation.</h2><p>Choose a situation to practise with your peer: a meeting, a call or an appointment.</p><button class="btn btn-blanc" onclick="goTab(\'peer\')">Prepare my meeting →</button></div></div><p class="footer-note">App + remote support · Optional on-site immersion to fit your goals</p>';}
var oldLearn=renderLearnHub;
function renderLearnHub(){if(S.pathId!==null&&S.pathId!==undefined)return renderPath(S.pathId);if(S.sub==='vocab')return renderVocab();if(S.sub==='bank')return renderMyBank();if(S.sub==='flashcards')return renderFlashcards();if(S.sub){var f={reviser:renderReviser,patterns:renderPatterns,confusing:renderConfusing,pron:renderPron,emotions:renderEmotions,comm:renderComm,pro:renderPro,interview:renderInterview,wskills:renderWriting,survival:renderSurvival,phrasal:renderPhrasal,collocations:renderCollocations,wordscontext:renderWordsContext,canadian:renderCanadian,daily:renderDaily}[S.sub];if(f)return (S.sub==='survival'?'<div class="notice">Fictional conversations for language practice. Check actual documents, timelines and amounts with the relevant service.</div>':'')+f();}return '<div class="sur">Learn</div><h1 class="titre-vue">Six steps. Your own pace.</h1><p class="note">Follow the learning journey or open what you need. Levels are difficulty guides, not placement test results.</p><div class="grid3">'+PATHS.map(pathCard).join('')+'</div><h2 class="section-title">Quick access to my tools</h2><div class="grid2"><div>'+moduleCard('vocab')+moduleCard('bank')+'</div><div>'+moduleCard('daily')+activity('My practice scenarios','Conversations and exercises to put your learning into practice.','↔',"goTab('missions')")+'</div></div>';}
function renderPath(i){var p=PATHS[i];return '<button class="btn btn-blanc back" onclick="goTab(\'learn\')">← All six steps</button><div class="module-top"><div class="sur">Step '+String(i+1).padStart(2,'0')+' · '+p.level+'</div><h1 class="titre-vue">'+p.title+'</h1><p class="note">'+p.desc+'</p><div class="notice"><strong>My goal:</strong> '+p.goal+'</div></div><div class="grid2"><div><h2 class="section-title" style="margin-top:0">Explore and understand</h2>'+p.mods.map(moduleCard).join('')+'</div><div><h2 class="section-title" style="margin-top:0">Put it into practice</h2>'+p.lessons.map(id=>{var l=REV_LECONS.find(x=>x.id===id);return activity(l.titre,S.revDone[id]?'Already explored · you can revisit this lesson':'Short lesson with exercises',S.revDone[id]?'✓':'→',"goLesson('"+id+"')");}).join('')+(p.mission?activity('A real-life situation',SITUATIONS.find(x=>x.id===p.mission).label,'↔',"openSituation('"+p.mission+"')"):'')+activity('Discuss it with my peer','Choose a phrase or a challenge to work on.','◉',"goTab('peer')")+'</div></div><div class="progress-note">After exploring and practising, record your progress. This personal marker does not certify a language level.</div><button class="btn '+(S.pathDone[p.id]?'btn-blanc':'btn-marine')+'" onclick="togglePath('+i+')">'+(S.pathDone[p.id]?'✓ Step explored · undo this marker':'I have explored this step')+'</button> '+(i<5?'<button class="btn btn-blanc" onclick="showPath('+(i+1)+')">Next step →</button>':'');}
function togglePath(i){var p=PATHS[i];S.pathDone[p.id]=!S.pathDone[p.id];if(!S.pathDone[p.id])delete S.pathDone[p.id];sauver();render();}
function buildWordBank(){wordBank=[];var add=(type,text,meaning,example,theme,level,note)=>wordBank.push({id:wordBank.length,type:type,text:text,meaning:meaning||'',example:example||'',theme:theme,level:level||'',note:note||''});VOCAB_BIB.forEach(t=>t.mots.forEach(w=>add('word',w[0],w[1],w[2],t.titre,t.lvl)));PV.forEach(g=>g.items.forEach(w=>add('phrasal',w[0],w[1],w[2],'Phrasal verbs · '+g.base,'',w[3])));COL.forEach(g=>g.items.forEach(w=>add('collocation',w[0],w[2],w[1],g.cat)));WC.forEach(g=>g.meanings.forEach(w=>add('word',g.w+' · '+w[0],w[2],w[1],'One word, several meanings')));EMO.forEach(g=>g.words.forEach(w=>add('word',w[0],w[1],w[2]+' / '+w[3],'Emotions · '+g.cat)));CAN_EXPR.forEach(w=>add('expr',w.e,w.m,w.d.join(' — '),'Everyday expressions','',w.use+' '+w.avoid));PATTERNS.forEach(w=>add('pattern',w.p,w.m,w.ex[0],'Patterns de phrases','',w.s));COMM.forEach(g=>g.ph.forEach(w=>add('expr',w,g.t,'','Communication')));SK.forEach(g=>g.vocab.forEach(w=>add('word',w[0],w[1],'',g.t)));}
function normalized(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function filteredWords(){return wordBank.filter(w=>(wordGroup==='all'||w.type===wordGroup)&&(wordLevel==='all'||w.level===wordLevel)&&(!searchText||normalized(w.text+' '+w.meaning+' '+w.example+' '+w.theme).includes(normalized(searchText))));}
function renderVocab(){return '<button class="btn btn-blanc back" onclick="goTab(\'learn\')">← Learn</button><div class="sur">Vocabulaire en contexte</div><h1 class="titre-vue">Les mots pour votre vie.</h1><p class="note">'+wordBank.length+' entrées de pratique : vocabulaire, expressions, structures et associations de mots. Une même expression peut revenir dans plusieurs contextes.</p><div class="toolbar"><label class="visually-hidden" for="wordSearch">Rechercher un mot, un sens ou une situation</label><input id="wordSearch" type="search" placeholder="Un mot, un sens ou une situation…" value="'+esc(searchText)+'" oninput="searchText=this.value;wordLimit=40;updateWordResults()"><label class="visually-hidden" for="wordType">Type d’expression</label><select id="wordType" onchange="wordGroup=this.value;wordLimit=40;updateWordResults()">'+[['all','All types'],['word','Words'],['expr','Expressions'],['pattern','Patterns'],['phrasal','Phrasal verbs'],['collocation','Word combinations']].map(x=>'<option value="'+x[0]+'" '+(wordGroup===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select><label class="visually-hidden" for="wordLevel">Suggested level</label><select id="wordLevel" onchange="wordLevel=this.value;wordLimit=40;updateWordResults()">'+['all','A1','A2','B1','B2'].map(n=>'<option value="'+n+'" '+(wordLevel===n?'selected':'')+'>'+(n==='all'?'All levels':n+' · suggested')+'</option>').join('')+'</select></div><div class="flex wrap between"><p class="muted">Les entrées sans niveau restent visibles dans « All levels ».</p><button class="text-button" onclick="goSub(\'bank\')">My favourites ('+bankCount()+')</button></div><div id="wordResults">'+wordResults()+'</div>';}
function wordResults(){var list=filteredWords();return '<p class="status-line" aria-live="polite">'+list.length+' résultat'+(list.length===1?'':'s')+'</p>'+list.slice(0,wordLimit).map(wordCard).join('')+(list.length>wordLimit?'<button class="btn btn-blanc btn-bloc" onclick="wordLimit+=40;updateWordResults()">Afficher la suite</button>':'')+(!list.length?'<div class="empty"><p>Aucun résultat. Essayez un autre mot ou retirez un filtre.</p><button class="btn btn-blanc" onclick="searchText=\'\';wordGroup=\'all\';wordLevel=\'all\';render()">Réinitialiser la recherche</button></div>':'');}
function updateWordResults(){document.getElementById('wordResults').innerHTML=wordResults();}
function wordCard(w){var saved=!!S.bank[w.type+'::'+w.text];return '<article class="word-card"><div class="flex between"><div class="term" lang="en">'+esc(w.text)+'</div><div class="word-actions"><button class="icon-button" aria-label="Listen '+esc(w.text)+'" onclick="speakEn(wordBank['+w.id+'].text)">♫</button><button class="icon-button" aria-label="'+(saved?'Remove from':'Add to')+' favourites" aria-pressed="'+saved+'" onclick="toggleWord('+w.id+',this)">'+(saved?'★':'☆')+'</button></div></div><p>'+esc(w.meaning)+'</p>'+(w.example?'<p class="example" lang="en">'+esc(w.example)+'</p>':'')+(w.note?'<p class="small muted">'+esc(w.note)+'</p>':'')+'<div class="word-tags"><span class="badge">'+esc(w.theme)+'</span>'+(w.level?'<span class="badge gold">'+w.level+' · suggested</span>':'')+'</div></article>';}
function toggleWord(i,btn){var w=wordBank[i],key=w.type+'::'+w.text;if(S.bank[key])delete S.bank[key];else S.bank[key]={type:w.type,text:w.text,extra:w.meaning,date:localDay()};sauver();if(btn){var on=!!S.bank[key];btn.textContent=on?'★':'☆';btn.setAttribute('aria-pressed',String(on));btn.setAttribute('aria-label',on?'Remove from favourites':'Add to favourites');}else render();}
function renderMyBank(){var items=Object.values(S.bank);var types={word:'Words',expr:'Expressions',pattern:'Patterns',phrasal:'Phrasal verbs',collocation:'Word combinations'};return '<button class="btn btn-blanc back" onclick="goTab(\'learn\')">← Learn</button><div class="sur">My vocabulary collection</div><h1 class="titre-vue">The words I want to keep.</h1><p class="note">'+items.length+' favourites · '+Object.keys(S.knownWords).filter(k=>S.knownWords[k]&&S.bank[k]).length+' marked “I remember”.</p>'+(items.length?'<div class="flex wrap" style="margin-bottom:20px"><button class="btn btn-marine" onclick="startFlashcards()">Review my cards →</button><button class="btn btn-blanc" onclick="goSub(\'vocab\')">Add words</button></div>'+items.map((b,i)=>'<article class="word-card"><div class="flex between"><div><span class="badge">'+esc(types[b.type]||'Expression')+'</span><p class="term" lang="en">'+esc(b.text)+'</p></div><div class="word-actions"><button class="icon-button" aria-label="Listen" onclick="speakEn(Object.values(S.bank)['+i+'].text)">♫</button><button class="icon-button" aria-label="Remove from favourites" onclick="removeBank('+i+')">★</button></div></div><p>'+esc(b.extra)+'</p></article>').join(''):'<div class="empty"><h2>Your collection starts with one word.</h2><p>Tap the star beside a word or expression to find it here.</p><button class="btn btn-marine" onclick="goSub(\'vocab\')">Explore vocabulary</button></div>');}
function removeBank(i){var b=Object.values(S.bank)[i];delete S.bank[b.type+'::'+b.text];sauver();render();}
function startFlashcards(){flashIds=Object.keys(S.bank).sort(()=>Math.random()-.5);flashIndex=0;flashFlipped=false;S.sub='flashcards';S.tab='learn';render();}
function renderFlashcards(){var b=S.bank[flashIds[flashIndex]];if(!b)return '<button class="btn btn-blanc back" onclick="goSub(\'bank\')">← My words</button><div class="empty"><h2>Your review session is complete.</h2><p>Come back regularly and try using one of these words in a real conversation.</p><button class="btn btn-marine" onclick="startFlashcards()">Start again</button></div>';return '<button class="btn btn-blanc back" onclick="goSub(\'bank\')">← My words</button><div class="sur">Review · Card '+(flashIndex+1)+' / '+flashIds.length+'</div><h1 class="titre-vue">Which word can you remember?</h1><div class="flashcard"><span class="badge">'+(flashFlipped?'The answer':'Start with the meaning')+'</span><div class="big">'+esc(flashFlipped?b.text:(b.extra||'Try to recall your expression.'))+'</div>'+(flashFlipped?'<button class="btn btn-blanc" onclick="speakEn(S.bank[flashIds[flashIndex]].text)">♫ Listen</button>':'<button class="btn btn-marine" onclick="flashFlipped=true;render()">Reveal the word</button>')+'</div>'+(flashFlipped?'<div class="grid2 compact" style="margin-top:16px"><button class="btn btn-blanc" onclick="flashNext(false)">Review again</button><button class="btn btn-marine" onclick="flashNext(true)">I remember</button></div>':'')+'<p class="footer-note">This is your own assessment, not a language level test.</p>';}
function flashNext(known){S.knownWords[flashIds[flashIndex]]=known;suivi('carte_revisee',known?'retenue':'a revoir');flashIndex++;flashFlipped=false;render();}
var originalSitu=renderSituation;
function openSituation(id){stopAudio();S.tab='missions';S.sub=null;S.situId=id;S.situStep=0;S.situAns=Object.assign({},S.situAttempts[id]||{});S.situChat=[];S.situBusy=false;S.lastActivity={kind:'mission',id:id};S.situVisited[id]=Object.assign({},S.situVisited[id]||{},{0:true});sauver();render();window.scrollTo(0,0);}
function situRepondre(key,oi){S.situAns[key]=oi;S.situAttempts[S.situId]=Object.assign({},S.situAns);sauver();render();}
function goSituStep(n){stopAudio();S.situStep=n;S.situVisited[S.situId]=Object.assign({},S.situVisited[S.situId]||{}, {[n]:true});sauver();render();window.scrollTo(0,0);}
function missionReady(){var s=getSitu();return s&&s.exos.every((x,i)=>S.situAns['e'+i]!==undefined)&&s.interactif.every((x,i)=>S.situAns['d'+i]!==undefined);}
function markMission(){if(!missionReady())return;S.situationsDone[S.situId]=true;suivi('mission_parcourue',S.situId);render();}
function renderPractice(){if(S.situId){var s=getSitu();if(S.situStep===5){var ex=s.exos.filter((x,i)=>S.situAns['e'+i]===x.bonne).length;return '<button class="btn btn-blanc back" onclick="quitSituation()">← My scenarios</button><div class="sur">My practice summary</div><h1 class="titre-vue">'+esc(s.label)+'</h1><div class="carte"><p>'+ex+' / '+s.exos.length+' correct exercise answers.</p><p class="note" style="margin-top:12px">AI role-play and listening are optional activities. Choose a phrase to practise with your peer or in everyday life.</p>'+(missionReady()?'<button class="btn btn-marine" onclick="markMission()">'+(S.situationsDone[s.id]?'✓ Scenario completed':'Mark this scenario as completed')+'</button>':'<div class="notice">Complete the interactive dialogue and the exercises to mark this scenario as completed.</div><button class="btn btn-marine" onclick="goSituStep(2)">Continue the dialogue</button>')+'</div><button class="btn btn-blanc" onclick="goTab(\'peer\')">Prepare my peer conversation</button>';}
 var content='<div class="notice">Fictional practice scenario: amounts, timelines and procedures are examples for learning English.</div>'+originalSitu();if(S.situStep===3)content='<div class="notice">The coach is an AI assistant, separate from your peer. '+(S.aiConsent?'You have agreed to send your messages to the AI service.':'Activate the coach in its section before you begin.')+' <button class="text-button" onclick="goTab(\'coach\')">Open the coach</button></div>'+content;return content;}
 return '<div class="sur">Practise</div><h1 class="titre-vue">Conversations that feel like real life.</h1><p class="note">Choose a situation. Explore its vocabulary, listen to the dialogue and practise. AI role-play is optional.</p><div class="grid2">'+SITUATIONS.filter(x=>x.dispo).map(s=>'<button class="step-card" onclick="openSituation(\''+s.id+'\')"><span class="badge">'+(S.situationsDone[s.id]?'✓ Explored':'Practice scenario')+'</span><h3>'+esc(s.label)+'</h3><p>'+esc(s.desc)+'</p><span class="foot"><span>Vocabulary · dialogue · exercises</span><span>→</span></span></button>').join('')+'</div><div class="soft-panel" style="margin-top:20px"><h2>A situation of your own?</h2><p>Prepare it for your peer or practise with the AI coach.</p><div class="flex wrap"><button class="btn btn-blanc" onclick="goTab(\'peer\')">With my peer</button><button class="btn btn-blanc" onclick="goTab(\'coach\')">With the AI coach</button></div></div>';}
function renderPeer(){var p=S.peer;return '<div class="sur">My support · SILFA</div><h1 class="titre-vue">Learn together, wherever you are.</h1><p class="note">Your app helps you prepare. Your peer helps you start speaking, rephrase your thoughts and use words in everyday life.</p><div class="grid2"><div class="soft-panel"><span class="badge">My support plan</span><h2>A conversation at my own pace.</h2><p>Peer matching, schedules and the number of meetings are arranged with UCBH according to your plan.</p><a class="btn btn-marine" href="mailto:'+UCBH_EMAIL+'?subject=SILFA%20-%20soutien%20entre%20pairs">Arrange my support with UCBH</a><div class="program-links"><a href="'+LIEN_RESERVATION+'" target="_blank" rel="noopener">View UCBH appointments ↗</a></div></div><div class="carte"><span class="sur">Before · During · After</span><h2 style="font-size:22px;margin:10px 0">Make your meeting useful.</h2><p class="note"><strong>Before:</strong> choose one situation and three words.<br><strong>During:</strong> try, listen and rephrase.<br><strong>After:</strong> write down one success and your next step.</p><button class="text-button" onclick="goTab(\'missions\')">Choose a practice scenario →</button></div></div><h2 class="section-title">My meeting notes</h2><p class="note">These notes stay on this device. Saving them does not book a meeting or notify your peer.</p><form class="carte" onsubmit="savePeer(event)"><div class="grid2 compact"><div class="field"><label for="peerName">Peer’s first name, if already arranged</label><input id="peerName" maxlength="80" value="'+esc(p.name)+'"></div><div class="field"><label for="peerMode">Meeting format</label><select id="peerMode">'+['Video call','Phone','In person'].map(x=>'<option '+(p.mode===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><div class="grid2 compact"><div class="field"><label for="peerDate">Agreed date</label><input id="peerDate" type="date" value="'+esc(p.date)+'"></div><div class="field"><label fo
