<script>/* AngloVie 3.3 — English email models, visual guidance and local drafts. */
APP_VERSION='3.3.0';
var EMAIL_PARTS=[
 {id:'subject',name:'Subject',tip:'Say what the email is about in a few words.',hint:'Request for information about…'},
 {id:'greeting',name:'Greeting',tip:'Start with the recipient’s name or team.',hint:'Hello [name],'},
 {id:'purpose',name:'Reason for writing',tip:'Explain why you are writing in your first sentence.',hint:'I am writing to ask about…'},
 {id:'details',name:'Useful details',tip:'Add the facts the reader needs. Keep paragraphs short.',hint:'I am available on…'},
 {id:'next',name:'Next step',tip:'Make it clear what you would like to happen next.',hint:'Could you please let me know…?'},
 {id:'closing',name:'Closing & name',tip:'Thank the reader, choose a sign-off and add your name.',hint:'Thank you for your help.\nKind regards,\n[your name]'}
];
var EMAIL_MODELS=[
 {id:'information',title:'Ask for information',group:'everyday',level:'A2',desc:'Ask about a course, service or activity.',focus:'Could you please…?',parts:{subject:'Question about [course or service]',greeting:'Hello [name or team],',purpose:'I would like some information about [course or service].',details:'I am interested in [topic]. I am available [days and times].',next:'Could you please let me know the schedule, cost and how to register?',closing:'Thank you for your help.\nKind regards,\n[your name]'}},
 {id:'appointment',title:'Book an appointment',group:'everyday',level:'A2',desc:'Suggest a time and ask for confirmation.',focus:'Would it be possible to…?',parts:{subject:'Appointment request — [reason]',greeting:'Hello [name or team],',purpose:'I would like to book an appointment to discuss [reason].',details:'I am available on [day, date] at [time], or on [alternative date] at [time].',next:'Would either of these times work for you? Please let me know how we will meet.',closing:'Thank you.\nBest regards,\n[your name]'}},
 {id:'reschedule',title:'Change an appointment',group:'everyday',level:'A2',desc:'Explain the change and offer another time.',focus:'Could we reschedule…?',parts:{subject:'Request to reschedule — [date and time]',greeting:'Hello [name],',purpose:'I am sorry, but I am no longer available for our appointment on [date] at [time].',details:'I am available on [alternative date] at [time].',next:'Could we reschedule for that time? If not, please suggest another option.',closing:'Thank you for your understanding.\nKind regards,\n[your name]'}},
 {id:'problem',title:'Report a problem',group:'everyday',level:'B1',desc:'Describe the facts and ask for a solution.',focus:'Could you please arrange…?',parts:{subject:'Problem with [item or service] — [reference, if needed]',greeting:'Hello [name or customer service team],',purpose:'I am writing about a problem with [item or service].',details:'On [date], [explain what happened]. This means that [briefly describe the impact].',next:'Could you please [describe the solution you are requesting] and let me know the next steps?',closing:'Thank you for looking into this.\nKind regards,\n[your name]'}},
 {id:'absence',title:'Report an absence',group:'work',level:'A2',desc:'Let your manager know you cannot attend.',focus:'I will not be able to…',parts:{subject:'Absence — [your name] — [date]',greeting:'Hello [manager’s name],',purpose:'I am unable to come to work on [date] because I am unwell.',details:'[Add any essential handover information, or remove this line.]',next:'I will update you about my return by [date or time].',closing:'Thank you for your understanding.\nBest regards,\n[your name]'},note:'Follow your workplace’s reporting process. Keep health details brief. Only mention cover arrangements that have been agreed.'},
 {id:'help',title:'Ask a colleague for help',group:'work',level:'A2',desc:'Explain what you need to complete a task.',focus:'Could you show me how to…?',parts:{subject:'Help with [task]',greeting:'Hi [name],',purpose:'Could you help me with [task]?',details:'I have already [explain what you have tried], but I am not sure how to [specific difficulty].',next:'Would you have a few minutes on [day] to show me what to do?',closing:'Thanks for your help.\nBest,\n[your name]'}},
 {id:'meeting',title:'Request a meeting',group:'work',level:'B1',desc:'Explain the goal and suggest a short meeting.',focus:'Would you be available…?',parts:{subject:'Meeting request — [topic]',greeting:'Hello [name],',purpose:'I would like to arrange a meeting to discuss [topic].',details:'The main points are [point one] and [point two]. I expect we will need about [number] minutes.',next:'Would you be available on [date] at [time]? Please let me know if another time would be better.',closing:'Thank you.\nKind regards,\n[your name]'}},
 {id:'followup',title:'Follow up on a message',group:'work',level:'B1',desc:'Refer to your earlier email and clarify your request.',focus:'I am following up on…',parts:{subject:'Follow-up — [original topic]',greeting:'Hello [name],',purpose:'I am following up on my email of [date] about [topic].',details:'I would still appreciate your help with [specific question or request].',next:'Could you please let me know if there is an update? I can provide more information if needed.',closing:'Thank you for your time.\nKind regards,\n[your name]'}},
 {id:'application',title:'Apply for a job',group:'career',level:'B1',desc:'Introduce yourself and connect your experience to the role.',focus:'I am writing to apply for…',parts:{subject:'Application for [job title] — [your name]',greeting:'Dear [hiring manager’s name or Hiring Team],',purpose:'I am writing to apply for the [job title] position advertised on [source].',details:'My experience in [relevant area] has helped me develop [relevant skill]. For example, [one brief, accurate example].\n\nI have attached my résumé for your review.',next:'I would welcome the opportunity to discuss how I could contribute to your team.',closing:'Thank you for considering my application.\nKind regards,\n[your name]'},note:'Adapt the example to your own experience. Attach the résumé before sending, or remove the attachment sentence.'},
 {id:'thanks',title:'Say thank you after an interview',group:'career',level:'B1',desc:'Thank the interviewer and mention something specific.',focus:'I appreciated learning about…',parts:{subject:'Thank you — [job title] interview',greeting:'Hello [interviewer’s name],',purpose:'Thank you for meeting with me on [date] to discuss the [job title] position.',details:'I particularly appreciated learning about [specific topic]. Our conversation strengthened my interest in the role.',next:'Please let me know if you need any further information from me.',closing:'Thank you again for your time.\nBest regards,\n[your name]'}}
];
var EMAIL_GROUPS=[{id:'everyday',name:'Everyday life',text:'Services, appointments and practical requests.',scene:'calendar'},{id:'work',name:'At work',text:'Colleagues, schedules and clear communication.',scene:'desk'},{id:'career',name:'Job search',text:'Applications, interviews and new opportunities.',scene:'people'}];
var EMAIL_CHECKS=['The recipient’s name and email address are correct.','My subject is clear and my request is easy to find.','I checked the dates, times and facts.','I added any attachment mentioned, or removed that sentence.','I read the message again and signed my name.'];
var emailView='models',emailGroup='all',emailPart=0;
var emailOldDefaults=defaults;
defaults=function(){return Object.assign(emailOldDefaults(),{emailDrafts:{},emailActive:'information'});};
PERSIST.push('emailDrafts','emailActive');
function emailModel(id){return EMAIL_MODELS.find(m=>m.id===id)||null;}
function emailValidId(id){return id==='custom'||!!emailModel(id);}
var emailOldNormalize=normalizeState;
normalizeState=function(){emailOldNormalize();var source=S.emailDrafts,clean={};if(source&&typeof source==='object'&&!Array.isArray(source))Object.keys(source).filter(emailValidId).forEach(id=>{var d=source[id];if(!d||typeof d!=='object'||!d.parts)return;var parts={};EMAIL_PARTS.forEach(p=>parts[p.id]=String(d.parts[p.id]||'').slice(0,p.id==='subject'?180:3000));clean[id]={parts:parts,checks:EMAIL_CHECKS.map((_,i)=>!!(Array.isArray(d.checks)&&d.checks[i])),updated:String(d.updated||'').slice(0,30)};});S.emailDrafts=clean;S.emailActive=emailValidId(S.emailActive)?S.emailActive:'information';};
var emailOldApply=applySaved;
applySaved=function(d){if(d&&typeof d==='object'){if(d.emailDrafts===undefined)S.emailDrafts={};if(d.emailActive===undefined)S.emailActive='information';}emailOldApply(d);};
MODULES.wskills=['Write an email','10 models, a visual guide and your own saved drafts.','✉'];
function emailIllustration(scene){
 var common='<rect width="360" height="172" rx="20" fill="#e6f1ec"/><circle cx="306" cy="38" r="65" fill="#cce2d8"/><circle cx="50" cy="160" r="74" fill="#daeae4"/>';
 var art=scene==='calendar'?'<rect x="93" y="23" width="169" height="130" rx="12" fill="#fffdf7" stroke="#173b40" stroke-width="2"/><path d="M94 60h167" stroke="#173b40" stroke-width="2"/><path d="M133 15v24m87-24v24" stroke="#173b40" stroke-width="7" stroke-linecap="round"/><g fill="#cce2d8"><rect x="114" y="76" width="29" height="21" rx="4"/><rect x="155" y="76" width="29" height="21" rx="4"/><rect x="196" y="76" width="29" height="21" rx="4"/><rect x="114" y="109" width="29" height="21" rx="4"/><rect x="155" y="109" width="29" height="21" rx="4"/></g><rect x="193" y="105" width="35" height="29" rx="6" fill="#e8b35e"/><path d="m201 119 6 6 13-15" fill="none" stroke="#173b40" stroke-width="3"/><rect x="251" y="94" width="59" height="42" rx="8" fill="#173b40"/><path d="m258 103 22 17 22-17" fill="none" stroke="#fffdf7" stroke-width="2"/><path d="m64 66 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#e8b35e"/>':scene==='people'?'<rect x="128" y="19" width="105" height="59" rx="12" fill="#fffdf7"/><path d="m145 42 23 15 47-25" fill="none" stroke="#2c7268" stroke-width="4" stroke-linecap="round"/><path d="m147 77-12 13 3-18" fill="#fffdf7"/><circle cx="91" cy="70" r="23" fill="#a97051"/><path d="M67 67c-2-42 54-38 49 3l-9-11-34-1Z" fill="#173b40"/><path d="M47 158v-25c0-44 88-44 88 0v25" fill="#2c7268"/><circle cx="267" cy="70" r="23" fill="#e2b08c"/><path d="M243 69c-7-38 51-42 49 3l-9-20-39 4Z" fill="#173b40"/><path d="M225 158v-25c0-44 86-44 86 0v25" fill="#e8b35e"/><rect x="111" y="117" width="135" height="10" rx="5" fill="#173b40"/><path d="M129 127v35m99-35v35" stroke="#173b40" stroke-width="6"/><rect x="153" y="88" width="54" height="32" rx="4" fill="#fffdf7" stroke="#173b40" stroke-width="2"/><circle cx="180" cy="105" r="3" fill="#2c7268"/>':'<rect x="75" y="29" width="189" height="113" rx="10" fill="#173b40"/><rect x="84" y="38" width="171" height="90" rx="5" fill="#fffdf7"/><rect x="116" y="56" width="108" height="56" rx="6" fill="#d9eae2"/><path d="m116 57 54 36 54-36" fill="none" stroke="#2c7268" stroke-width="3"/><path d="M170 141v12m-22 0h44" stroke="#173b40" stroke-width="7" stroke-linecap="round"/><path d="M48 156h262" stroke="#173b40" stroke-width="4" stroke-linecap="round"/><path d="M288 124v30" stroke="#2c7268" stroke-width="3"/><path d="M288 130c-25 0-28-25-16-30 14-2 20 21 16 30m1-2c28-3 30-27 18-28-14 0-20 17-18 28" fill="#2c7268"/><path d="M273 140h31l-5 16h-21Z" fill="#e8b35e"/><circle cx="254" cy="29" r="17" fill="#e8b35e"/><path d="m247 29 5 5 10-12" stroke="#173b40" stroke-width="3" fill="none"/>';
 return '<svg class="email-illustration" viewBox="0 0 360 172" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">'+common+art+'</svg>';
}
function openEmail(view,id){if(id&&emailValidId(id))S.emailActive=id;emailView=['models','structure','editor','practice'].includes(view)?view:'models';S.wsId=null;goSub('wskills');}
function emailNavigate(view){stopAudio();emailView=view;S.wsId=null;render();window.scrollTo(0,0);}
function emailGetDraft(){var id=S.emailActive;if(!S.emailDrafts[id]){var m=emailModel(id),parts={};EMAIL_PARTS.forEach(p=>parts[p.id]=m?m.parts[p.id]:'');S.emailDrafts[id]={parts:parts,checks:EMAIL_CHECKS.map(()=>false),updated:''};}return S.emailDrafts[id];}
function emailUse(id){if(!emailValidId(id))return;S.emailActive=id;emailGetDraft();emailView='editor';S.wsId=null;sauver();render();window.scrollTo(0,0);}
function emailSetGroup(id){emailGroup=id;render();}
function emailLabel(){var m=emailModel(S.emailActive);return m?m.title:'My own email';}
function renderWriting(){
 if(emailView==='practice'&&S.wsId!==null&&S.wsId!==undefined&&WS[S.wsId])return renderWritingDetail();
 var tabs=[['models','Email models'],['structure','The structure'],['editor','My email'],['practice','Practice tasks']];
 return '<section class="email-studio"><button class="text-button back" onclick="goSub(null)">← My learning tools</button><div class="email-heading"><div><span class="sur">Everyday English · Writing studio</span><h1 class="titre-vue">Write an email.<br><span>Make your message clear.</span></h1><p class="note">See a model, understand the structure and make it your own.</p></div><div class="email-heading-art">'+emailIllustration('desk')+'</div></div><nav class="email-tabs" aria-label="Email writing tools">'+tabs.map(t=>'<button aria-pressed="'+(emailView===t[0])+'" class="'+(emailView===t[0]?'selected':'')+'" onclick="emailNavigate(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</nav>'+(emailView==='structure'?renderEmailStructure():emailView==='editor'?renderEmailEditor():emailView==='practice'?renderEmailPractice():renderEmailModels())+'</section>';
}
function renderEmailModels(){return '<div class="section-line"><h2>What would you like to say?</h2><button class="text-button" onclick="emailUse(\'custom\')">Start a blank email →</button></div><div class="email-scenes">'+EMAIL_GROUPS.map(g=>'<button class="email-scene '+(emailGroup===g.id?'selected':'')+'" aria-pressed="'+(emailGroup===g.id)+'" onclick="emailSetGroup(\''+g.id+'\')">'+emailIllustration(g.scene)+'<span class="email-scene-copy"><strong>'+g.name+'</strong><small>'+g.text+'</small></span></button>').join('')+'</div><div class="email-filter-line"><p class="note">Choose a model. Replace the words in [brackets] with your own details.</p><button class="chip '+(emailGroup==='all'?'on':'')+'" aria-pressed="'+(emailGroup==='all')+'" onclick="emailSetGroup(\'all\')">All 10 models</button></div><div class="email-model-grid">'+EMAIL_MODELS.filter(m=>emailGroup==='all'||m.group===emailGroup).map(m=>'<article class="email-model"><div class="email-model-meta"><span class="badge">'+m.level+' · suggested</span>'+(S.emailDrafts[m.id]?'<span class="email-draft-badge">Draft kept</span>':'')+'</div><h3>'+m.title+'</h3><p>'+m.desc+'</p><p class="email-useful">'+m.focus+'</p><button class="btn btn-marine" onclick="emailUse(\''+m.id+'\')">'+(S.emailDrafts[m.id]?'Continue my draft':'Use this model')+' →</button></article>').join('')+'</div><div class="email-tip"><strong>A useful habit</strong><p>Write one main message, make one clear request and keep only the details the reader needs.</p></div>';}
var EMAIL_EXAMPLE={subject:'Question about evening English classes',greeting:'Hello Jordan,',purpose:'I would like some information about your evening English classes.',details:'I work during the day, so I am looking for a class after 6 p.m.',next:'Could you please tell me which evenings are available and how much the course costs?',closing:'Thank you for your help.\nKind regards,\nAlex'};
function renderEmailStructure(){return '<div class="email-section-intro"><h2>Six parts. One clear message.</h2><p>Select a part to see where it belongs. This is a flexible guide: a short email may combine the reason, details and request.</p></div><div class="email-anatomy"><div class="email-part-guide">'+EMAIL_PARTS.map((p,i)=>'<button class="email-part-guide-item '+(emailPart===i?'selected':'')+'" aria-pressed="'+(emailPart===i)+'" onclick="emailSelectPart('+i+')"><span aria-hidden="true" class="email-number part-'+i+'">'+(i+1)+'</span><span><strong>'+p.name+'</strong><small>'+p.tip+'</small></span></button>').join('')+'</div><div class="email-paper"><div class="email-paper-top"><span class="email-envelope" aria-hidden="true">✉</span><span>A complete example</span><span class="badge">Fictional names</span></div>'+EMAIL_PARTS.map((p,i)=>'<div class="email-example-part part-'+i+' '+(emailPart===i?'highlight':'')+'" id="emailPart'+i+'"><div class="email-example-label">'+(i+1)+' · '+p.name+'</div><p>'+esc(EMAIL_EXAMPLE[p.id])+'</p></div>').join('')+'</div></div><div class="email-tone-grid"><div class="email-tip"><strong>Professional & polite</strong><p>“Hello Jordan,” or “Dear Hiring Team,”<br>“Could you please…?”<br>“Kind regards,” or “Best regards,”</p></div><div class="email-tip"><strong>Friendly & familiar</strong><p>“Hi Jordan,”<br>“Could you help me with…?”<br>“Thanks,” or “Best,”</p></div><div class="email-tip"><strong>Be specific</strong><p>Instead of “Information”, try “Question about evening classes”. Instead of “Send it”, try “Could you please send the schedule?”</p></div></div><button class="btn btn-marine" onclick="emailUse(\'information\')">Try this structure →</button>';}
function emailSelectPart(i){emailPart=i;document.querySelectorAll('.email-part-guide-item').forEach((b,n)=>{b.classList.toggle('selected',n===i);b.setAttribute('aria-pressed',String(n===i));});document.querySelectorAll('.email-example-part').forEach((e,n)=>e.classList.toggle('highlight',n===i));if(innerWidth<850)document.getElementById('emailPart'+i).scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
function emailText(){var p=emailGetDraft().parts;return 'Subject: '+p.subject.trim()+'\n\n'+EMAIL_PARTS.slice(1).map(x=>p[x.id].trim()).filter(Boolean).join('\n\n');}
function emailPreview(){var p=emailGetDraft().parts;return '<div class="email-preview-subject"><span>Subject</span><strong>'+(p.subject.trim()?esc(p.subject):'<em>Your subject will appear here</em>')+'</strong></div><div class="email-preview-body">'+EMAIL_PARTS.slice(1).filter(x=>p[x.id].trim()).map(x=>'<p>'+esc(p[x.id])+'</p>').join('')+(!EMAIL_PARTS.slice(1).some(x=>p[x.id].trim())?'<p class="muted">Your message will appear here as you write.</p>':'')+'</div>';}
function emailReviewStatus(){var d=emailGetDraft(),p=d.parts,text=emailText(),placeholders=(text.match(/\[[^\]]*\]/g)||[]).length,missing=['subject','greeting','purpose','closing'].filter(k=>!p[k].trim()).map(k=>EMAIL_PARTS.find(x=>x.id===k).name),warnings=[];if(placeholders)warnings.push('Replace '+placeholders+' bracketed placeholder'+(placeholders===1?'':'s')+' before using this email.');if(missing.length)warnings.push('Add: '+missing.join(', ')+'.');if(!p.next.trim())warnings.push('Check whether the reader needs a clear next step.');return '<p class="email-review-count">'+EMAIL_PARTS.slice(1).map(x=>p[x.id]).join(' ').trim().split(/\s+/).filter(Boolean).length+' words · '+d.checks.filter(Boolean).length+' / '+EMAIL_CHECKS.length+' checks completed</p>'+(warnings.length?'<ul class="email-warnings">'+warnings.map(w=>'<li>'+w+'</li>').join(''):'<p class="email-ready">No bracketed placeholders remain. Review the facts, tone and spelling before you use your message.</p>');}
function renderEmailEditor(){var d=emailGetDraft(),m=emailModel(S.emailActive);return '<div class="email-editor-top"><div><span class="sur">Your draft</span><h2>'+esc(emailLabel())+'</h2><p class="note">Edit the model below. Changes are kept on this device and included in your progress backup.</p></div><div><label for="emailDraftSelect">Open another draft</label><select id="emailDraftSelect" onchange="emailUse(this.value)">'+EMAIL_MODELS.concat([{id:'custom',title:'My own email'}]).map(x=>'<option value="'+x.id+'" '+(x.id===S.emailActive?'selected':'')+'>'+x.title+(S.emailDrafts[x.id]?' · draft':'')+'</option>').join('')+'</select></div></div>'+(m&&m.note?'<p class="email-context-note">'+esc(m.note)+'</p>':'')+'<div class="email-editor-grid"><div class="email-fields">'+EMAIL_PARTS.map((p,i)=>'<div class="email-field"><label for="emailField_'+p.id+'"><span aria-hidden="true" class="email-number part-'+i+'">'+(i+1)+'</span>'+p.name+'</label><p id="emailHint_'+p.id+'">'+p.tip+'</p>'+(p.id==='subject'?'<input':'<textarea rows="'+(p.id==='closing'||p.id==='details'?4:2)+'"')+' id="emailField_'+p.id+'" aria-label="'+p.name+'" aria-describedby="emailHint_'+p.id+'" maxlength="'+(p.id==='subject'?180:3000)+'" placeholder="'+esc(p.hint)+'" oninput="emailUpdate(\''+p.id+'\',this.value)"'+(p.id==='subject'?' value="'+esc(d.parts[p.id])+'">':'>'+esc(d.parts[p.id])+'</textarea>')+'</div>').join('')+'<button class="text-button" onclick="emailResetDraft()">'+(m?'Reset this draft to the model':'Clear this draft')+'</button></div><div class="email-preview-column"><div class="email-paper email-live-paper"><div class="email-paper-top"><span class="email-envelope" aria-hidden="true">✉</span><strong>Your email preview</strong><span id="emailSaveStatus" class="email-save">'+(storageFailed?'Not saved':d.updated?'Saved on this device':'Ready to edit')+'</span></div><div id="emailPreview">'+emailPreview()+'</div></div><div class="email-actions"><button class="btn btn-marine" onclick="emailCopy()">Copy email</button><button class="btn btn-blanc" onclick="emailDownload()">Download .txt</button><button class="btn btn-blanc" onclick="emailListen()">Read aloud</button><button class="text-button" onclick="stopAudio()">Stop audio</button></div><div class="email-review"><h3>Before you use your email</h3><div id="emailReviewStatus" role="status" aria-live="polite">'+emailReviewStatus()+'</div><div class="email-checklist">'+EMAIL_CHECKS.map((c,i)=>'<label><input type="checkbox" '+(d.checks[i]?'checked':'')+' onchange="emailCheck('+i+',this.checked)"><span>'+c+'</span></label>').join('')+'</div><p class="muted small">These checks support your own review. They do not check grammar automatically.</p></div><p class="email-local-note">Use Copy or Download when you are ready to move your draft into your email app. Nothing is sent from this page.</p></div></div>';}
function emailUpdate(key,value){if(!EMAIL_PARTS.some(p=>p.id===key))return;var d=emailGetDraft();d.parts[key]=value.slice(0,key==='subject'?180:3000);d.checks=EMAIL_CHECKS.map(()=>false);d.updated=new Date().toISOString();sauver();document.getElementById('emailPreview').innerHTML=emailPreview();document.querySelectorAll('.email-checklist input').forEach(e=>e.checked=false);document.getElementById('emailSaveStatus').textContent=storageFailed?'Not saved — download a copy':'Saved on this device';document.getElementById('emailReviewStatus').innerHTML=emailReviewStatus();}
function emailCheck(i,checked){emailGetDraft().checks[i]=!!checked;sauver();document.getElementById('emailReviewStatus').innerHTML=emailReviewStatus();}
function emailResetDraft(){if(!confirm('Reset this draft? Your changes to this email will be replaced. Other drafts will stay saved.'))return;delete S.emailDrafts[S.emailActive];emailGetDraft();sauver();render();toast('This draft has been reset.');}
async function emailCopy(){var text=emailText();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}else{var box=document.createElement('textarea');box.value=text;box.setAttribute('aria-label','Email text to copy');box.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.append(box);box.select();var ok=document.execCommand('copy');box.remove();if(!ok)throw new Error('copy');}toast(/\[[^\]]*\]/.test(text)?'Copied. Replace the bracketed placeholders before sending.':'Email copied. Review it in your email app before sending.');}catch(e){toast('Copy is unavailable here. Use Download .txt to keep your email.');}}
function emailDownload(){downloadText('AngloVie-email-'+S.emailActive+'.txt',emailText());toast('Your draft has been downloaded.');}
function emailListen(){speakEn(emailText());}
function renderEmailPractice(){return '<div class="email-section-intro"><h2>Now write without a model.</h2><p>Use one of these situations to practise. You can review your draft yourself or with your peer. AI feedback is optional and requires an activated online coach.</p></div><div class="email-model-grid">'+WS.map((w,i)=>'<article class="email-model"><span class="sur">Practice '+(i+1)+'</span><h3>'+esc(w.t)+'</h3><p>'+esc(w.task)+'</p><button class="btn btn-blanc" onclick="S.wsId='+i+';S.wsText=\'\';S.wsFeedback=null;render();window.scrollTo(0,0)">Open practice task →</button></article>').join('')+'</div>';}
var emailOriginalHome=renderHome;
renderHome=function(){var h=emailOriginalHome(),panel='<section class="email-home-panel"><div class="email-home-art">'+emailIllustration('desk')+'</div><div><span class="sur">Write with confidence</span><h2>The right words for your next email.</h2><p>10 useful models, a visual structure and a space to write your own message.</p><button class="btn btn-marine" onclick="openEmail(\'models\')">Write an email →</button></div></section>';return h.replace('<p class="footer-note">',panel+'<p class="footer-note">');};
var emailOriginalLearn=renderLearnHub;
renderLearnHub=function(){var h=emailOriginalLearn();if((S.pathId===null||S.pathId===undefined)&&!S.sub)h+='<div class="email-learn-link">'+moduleCard('wskills')+'</div>';return h;};
// Remove an overgeneralized label inherited from the original writing exercise.
WS[5].when='Let your manager know about an absence and share essential handover information.';
</script>

<style>.coach-access-panel{max-width:1000px}.coach-access-panel h2{font-size:24px;margin:12px 0 8px}.coach-access-panel .field{max-width:520px;margin:18px 0}.coach-state{display:inline-flex;padding:6px 11px;border-radius:30px;background:#f5e6c6;color:#745621;font-size:12px;font-weight:700}.coach-state.available{background:#e1efe6;color:#286149}.coach-admin{margin-top:20px;border-top:1px solid #dbe4df;padding-top:15px;font-size:13px;line-height:1.7;color:#566c61}.coach-admin summary{cursor:pointer;font-weight:650}.coach-admin p{margin-top:10px;overflow-wrap:anywhere}.coach-admin code{font-size:12px;background:#eef3ef;padding:1px 4px;border-radius:4px}.coach-consent-line{display:flex;gap:15px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:#eaf3ec;border-radius:12px;padding:15px 18px;font-size:14px;color:#275541;margin:15px 0}.coach-alternatives{background:#eaf0e9;padding:24px;border-radius:15px;margin:20px 0}.coach-alternatives h2{font-size:22px}.coach-alternatives p{font-size:14px;color:#506456;margin:7px 0 15px}.coach-compose{display:flex;gap:12px;align-items:flex-end}.coach-compose textarea{resize:vertical;flex:1;min-width:0;font:inherit;line-height:1.6;padding:13px;border:1px solid #b7c8bd;border-radius:10px;min-height:85px;background:#fffefa}.coach-error{background:#fff2d9;color:#705123}.coach-access-panel input{max-width:100%}
@media(max-width:520px){.coach-access-panel{padding:20px}.coach-access-panel h2{font-size:22px}.coach-compose{flex-direction:column;align-items:stretch}.coach-compose textarea{width:100%}}
</style>
<script>/* AngloVie 3.3.1 — explicit coach availability, verified sessions and actionable errors. */
APP_VERSION='3.3.1';
aiState={configured:false,authenticated:false,checked:false,checking:false,phase:'idle',message:'',activating:false};
var coachDraft='',coachError='',coachTurn=0,aiCheckPromise=null;
function coachReady(){return aiState.phase==='ready'&&aiState.authenticated&&S.aiConsent&&navigator.onLine;}
function aiError(message,code,status){var e=new Error(message);e.code=code;e.status=status||0;return e;}
async function aiJSON(endpoint,options,timeout){
 var controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout||15000);
 try{
  var response=await fetch('./.netlify/functions/'+endpoint,Object.assign({credentials:'same-origin',cache:'no-store'},options||{},{signal:controller.signal}));
  var raw=await response.text(),data;
  try{data=JSON.parse(raw);}catch(e){throw aiError(response.status===404?'The AI connection is missing from this website. UCBH needs to publish the server functions.':'This website did not return a valid AI service response. Open the app at its own web address and try again.','unavailable',response.status);}
  if(!data||typeof data!=='object'||Array.isArray(data))throw aiError('The AI service returned an invalid response. Please try again.','unavailable',response.status);
  if(!response.ok)throw aiError(typeof data.error==='string'?data.error:response.status===429?'Too many attempts. Please wait a minute before trying again.':'The AI service could not complete the request. Please try again.',response.status===401?'unauthorized':response.status===503?'unconfigured':'request',response.status);
  return data;
 }catch(e){if(e.code)throw e;throw aiError(e.name==='AbortError'?'The AI service took too long to respond. Please try again.':!navigator.onLine?'You are offline. Reconnect to use the AI coach.':'The AI service could not be reached. Check your connection and try again.','unavailable');}
 finally{clearTimeout(timer);}
}
function aiRenderIfOpen(){if(S.tab==='coach'&&S.screen==='app')render();}
function aiUnavailablePhase(){if(location.protocol==='file:')return 'local';if(!navigator.onLine)return 'offline';return null;}
function checkAI(){
 if(aiCheckPromise)return aiCheckPromise;
 var unavailable=aiUnavailablePhase();
 if(unavailable){aiState.phase=unavailable;aiState.checked=true;aiState.authenticated=false;aiState.configured=false;aiState.message='';return Promise.resolve(false);}
 aiState.phase='checking';aiState.checking=true;aiState.checked=true;aiState.message='';
 aiCheckPromise=(async function(){
  try{var d=await aiJSON('auth');if(typeof d.configured!=='boolean'||typeof d.authenticated!=='boolean')throw aiError('This address does not provide the expected AngloVie AI access service. UCBH needs to check the installation.','unavailable');aiState.configured=d.configured;aiState.authenticated=d.configured&&d.authenticated;aiState.phase=!d.configured?'unconfigured':d.authenticated?'ready':'locked';return aiState.authenticated;}
  catch(e){aiState.authenticated=false;aiState.configured=false;aiState.phase='unavailable';aiState.message=e.message;return false;}
  finally{aiState.checking=false;aiCheckPromise=null;aiRenderIfOpen();}
 })();
 return aiCheckPromise;
}
function retryAI(){checkAI();aiRenderIfOpen();}
function aiAccessPanel(){
 var state=aiState.phase;
 var text={local:['Open the online app to use AI','You are using a downloaded HTML file. Lessons and writing tools work here, but the AI coach needs the published app with its server connection. An access code or consent button cannot activate AI inside this file.'],offline:['Reconnect to use the AI coach','You are offline. Your learning activities and saved drafts remain available. Reconnect, then check the connection again.'],checking:['Checking the AI connection…','Please wait while we check the service and your access.'],unconfigured:['The AI service is not set up yet','UCBH needs to connect the AI service on the published app before learner access can be activated. Giving consent does not activate the service.'],unavailable:['The AI connection could not be verified',aiState.message||'Check the connection, then try again.'],locked:['Step 1 · Activate your access','Enter the personal AI access code provided by UCBH. This is separate from your permission to send practice messages.'],ready:['Step 1 · Access verified','Your access session is active on this website.']}[state]||['Checking the AI connection…','Please wait.'];
 var h='<section class="carte coach-access-panel"><span class="coach-state '+(state==='ready'?'available':'')+'">'+(state==='ready'?'Access verified':state==='checking'?'Checking':'AI not ready')+'</span><h2>'+text[0]+'</h2><p class="note">'+esc(text[1])+'</p>';
 if(state==='locked')h+='<form onsubmit="activateAI(event)"><div class="field"><label for="aiCode">My AI access code</label><input id="aiCode" type="password" required maxlength="200" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="aiStatus"></div><button class="btn btn-marine" id="aiActivate" '+(aiState.activating?'disabled':'')+'>'+(aiState.activating?'Verifying access…':'Activate my access')+'</button></form>';
 if(aiState.message&&state!=='unavailable')h+='<p class="status-line error" id="aiStatus" role="alert">'+esc(aiState.message)+'</p>';else h+='<p class="status-line" id="aiStatus" role="status"></p>';
 if(state==='ready')h+='<button class="text-button" onclick="logoutAI()">Sign out of AI access</button>';
 else if(!['local','checking'].includes(state))h+='<button class="btn btn-blanc" style="margin-top:12px" onclick="retryAI()">Check connection again</button>';
 if(['local','unavailable','unconfigured'].includes(state))h+='<details class="coach-admin"><summary>For the programme administrator</summary><p>Publish the complete project with its Netlify Functions. Configure <code>ANTHROPIC_API_KEY</code>, <code>SILFA_SESSION_SECRET</code> and <code>SILFA_AI_CODES_JSON</code> on the server, then redeploy. The ZIP’s README explains the setup. Keep API keys out of this HTML file and out of learner access codes.</p></details>';
 return h+'</section>';
}
renderCoach=function(){
 var unavailable=aiUnavailablePhase();if(unavailable&&!aiState.checking)aiState.phase=unavailable;
 if(!aiState.checked&&!unavailable)checkAI();
 var ready=coachReady(),h='<button class="btn btn-blanc back" onclick="goTab(\'missions\')">← Practise</button><div class="sur">Extra practice</div><h1 class="titre-vue">My AI coach.</h1><p class="note">Practise English with an AI assistant. Your human peer is available through “My support”.</p>'+aiAccessPanel();
 if(aiState.phase==='ready')h+=!S.aiConsent?'<section class="carte"><h2 style="font-size:22px">Step 2 · Permission to send your exercises</h2><p class="note">When you send an exercise, your text is sent to Anthropic’s AI service. Share only what the practice needs. AI can make mistakes.</p><button class="btn btn-marine" onclick="coachConsent(true)">I agree and open the coach</button></section>':'<div class="coach-consent-line"><span>✓ Step 2 · Permission given. You can send an exercise.</span><button class="text-button" onclick="coachConsent(false)">Withdraw my consent</button></div>';
 if(!ready){h+='<section class="coach-alternatives"><h2>Practise while you wait</h2><p>These activities work without AI activation.</p><div class="flex wrap"><button class="btn btn-blanc" onclick="openEmail(\'models\')">Write an email</button><button class="btn btn-blanc" onclick="openStudy(0)">Review vocabulary</button><button class="btn btn-blanc" onclick="goTab(\'missions\')">Practise a dialogue</button></div></section>';if(coachDraft)h+='<p class="notice">Your unsent exercise is kept for this visit. Complete the access steps to send it.</p>';}
 if(ready||S.coachChat.length)h+='<div class="chat-zone" id="coachZone">'+(S.coachChat.length?S.coachChat.map(m=>'<div class="bulle '+(m.role==='user'?'moi':'ia')+'">'+esc(m.content)+'</div>').join(''):'<p class="muted" style="padding:20px">Try: Help me introduce myself to a colleague.</p>')+(S.coachBusy?'<div class="bulle ia" role="status">Preparing a reply…</div>':'')+'</div>';
 if(coachError)h+='<p class="notice coach-error" role="alert">'+esc(coachError)+'</p>';
 if(ready)h+='<form onsubmit="event.preventDefault();coachSend()"><div class="coach-compose"><label class="visually-hidden" for="coachInput">My message to the coach</label><textarea id="coachInput" maxlength="3000" rows="3" placeholder="Write your message…" oninput="coachDraft=this.value" '+(S.coachBusy?'disabled':'')+'>'+esc(coachDraft)+'</textarea><button class="btn btn-marine" '+(S.coachBusy?'disabled':'')+'>Send</button></div></form><div class="chips"><button class="chip" '+(S.coachBusy?'disabled':'')+' onclick="coachQuick(\'Please help me ask for clarification at work.\')">Ask for clarification</button><button class="chip" '+(S.coachBusy?'disabled':'')+' onclick="coachQuick(\'Please explain the last grammar point in simple English.\')">A simpler explanation</button><button class="chip" '+(S.coachBusy?'disabled':'')+' onclick="coachReviewBank()">Review my favourites</button></div>';
 if(S.coachChat.length)h+='<button class="text-button" '+(S.coachBusy?'disabled':'')+' onclick="clearCoachChat()">Clear this conversation</button>';
 return h;
};
function coachConsent(value){S.aiConsent=!!value;sauver();render();if(value){var input=document.getElementById('coachInput');if(input)input.focus();}}
activateAI=async function(e){e.preventDefault();if(aiState.activating)return;var input=document.getElementById('aiCode'),code=input?input.value.trim():'';if(!code)return;aiState.activating=true;aiState.message='';var button=document.getElementById('aiActivate');if(button){button.disabled=true;button.textContent='Verifying access…';}
 try{var result=await aiJSON('auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})});if(result.authenticated!==true)throw aiError('The service did not confirm your access. Please try again.','unavailable');
  var verified=await aiJSON('auth');if(!verified.configured||!verified.authenticated)throw aiError('Your code was accepted, but this browser did not keep the access session. Open the app in its own browser tab, allow cookies for this website, then try again.','cookie');aiState.configured=true;aiState.authenticated=true;aiState.phase='ready';aiState.message='';
 }catch(error){aiState.authenticated=false;aiState.phase=error.code==='unconfigured'?'unconfigured':'locked';aiState.message=error.message;}
 finally{aiState.activating=false;aiRenderIfOpen();}
};
logoutAI=async function(){try{await aiJSON('auth',{method:'DELETE'});coachTurn++;aiState.authenticated=false;aiState.phase='locked';aiState.message='';S.coachChat=[];S.coachBusy=false;coachDraft='';coachError='';render();}catch(e){coachError='Sign-out could not be confirmed. '+e.message;aiRenderIfOpen();}};
nellyAPI=async function(body){
 if(location.protocol==='file:')throw aiError('Open the published app to use AI. A downloaded HTML file cannot connect to this coach.','local');
 if(!navigator.onLine)throw aiError('Reconnect to use the AI coach.','offline');
 if(!S.aiConsent)throw aiError('Open AI coach and complete Step 2 to allow your exercise to be sent.','consent');
 try{var d=await aiJSON('claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:body.messages,system:body.system,max_tokens:body.max_tokens,level:S.niveau})},35000);if(!Array.isArray(d.content)||!d.content.some(x=>x.type==='text'&&typeof x.text==='string'&&x.text.trim()))throw aiError('The coach returned an empty reply. Please try again.','empty');return d;}
 catch(e){if(e.status===401){aiState.authenticated=false;aiState.phase='locked';aiState.message='Your access session has expired. Enter your code again.';}if(e.status===503){aiState.authenticated=false;aiState.configured=false;aiState.phase='unconfigured';aiState.message=e.message;}throw e;}
};
coachQuick=function(message){if(S.coachBusy)return;coachDraft=String(message).slice(0,3000);if(S.tab!=='coach')goTab('coach');coachPush(coachDraft);};
coachSend=async function(){var input=document.getElementById('coachInput');var message=input?input.value.trim():coachDraft.trim();if(!message||S.coachBusy)return;await coachPush(message);};
coachPush=async function(message){
 if(S.coachBusy)return;message=String(message||'').trim().slice(0,3000);if(!message)return;coachDraft=message;coachError='';
 if(!coachReady()){S.tab='coach';S.screen='app';render();toast('Check the access status shown above. Your exercise has not been sent.');return;}
 var turn=++coachTurn;S.coachChat.push({role:'user',content:message});S.coachBusy=true;render();scrollCoach();
 try{var history=S.coachChat.slice(-15);while(history.length&&history[0].role!=='user')history.shift();var d=await nellyAPI({messages:history,system:COACH_SYSTEM,max_tokens:700});if(turn!==coachTurn)return;S.coachChat.push({role:'assistant',content:d.content.filter(c=>c.type==='text').map(c=>c.text).join('')});coachDraft='';suivi('coach_ia','exercise');}
 catch(e){if(turn!==coachTurn)return;S.coachChat.pop();coachError=e.message+' Your text is kept so you can try again.';}
 finally{if(turn===coachTurn){S.coachBusy=false;aiRenderIfOpen();if(S.tab==='coach')scrollCoach();}}
};
function clearCoachChat(){if(S.coachBusy)return;S.coachChat=[];coachError='';render();}
window.addEventListener('online',function(){if(S.tab==='coach'){aiState.checked=false;retryAI();}});
window.addEventListener('offline',function(){if(S.tab==='coach'){aiState.phase='offline';aiRenderIfOpen();}});
</script>
