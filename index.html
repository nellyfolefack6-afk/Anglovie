<script>
/* 555 contexts reviewed and integrated into the six SILFA steps. */
var ENRICHED_DATA=[{"type":"phrasal","text":"chat up","meaning":"Talk to someone to show romantic interest.","example":"He tried to chat up the girl at the party, but she wasn't interested.","theme":"Verbs in context","level":"B1","step":5,"note":"Informal and often romantic. Avoid this expression in professional interactions.","legacy":"phrasal::chat up"},{"type":"collocation","text":"chat about","meaning":"Have an informal conversation about something.","example":"We sat in the garden and chatted about our childhood memories.","theme":"Verbs in context","level":"A2","step":0,"note":"","legacy":"phrasal::chat about"},{"type":"collocation","text":"chat with","meaning":"Have a friendly conversation with someone.","example":"He chatted with the new student and helped him feel welcome.","theme":"Verbs in context","level":"A2","step":0,"note":"Both chat with someone and chat to someone are used.","legacy":"phrasal::chat with"},{"type":"collocation","text":"chat over coffee","meaning":"Have a conversation while drinking coffee.","example":"Let's chat over coffee and plan our trip.","theme":"Verbs in context","level":"A2","step":2,"note":"Over coffee describes the setting of the conversation.","legacy":"phrasal::chat over"},{"type":"phrasal","text":"chat away","meaning":"Talk for a long time in a relaxed way.","example":"They chatted away for hours about their favorite books.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::chat away"},{"type":"collocation","text":"reply to a message","meaning":"Send an answer to a message.","example":"Please reply to my message when you have a moment.","theme":"Verbs in context","level":"A2","step":2,"note":"For answering a message, use reply or reply to a message.","legacy":"phrasal::chat back"},{"type":"phrasal","text":"find out","meaning":"Discover a piece of information.","example":"I need to find out the time of the meeting.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::find out"},{"type":"phrasal","text":"find out about","meaning":"Learn information about a subject.","example":"I was trying to find out about the company's new policies.","theme":"Verbs in context","level":"B1","step":5,"note":"Pattern: find out about + subject.","legacy":"phrasal::find out about"},{"type":"phrasal","text":"find for / find against","meaning":"Make a legal decision in favour of, or against, a party.","example":"The court found for the tenant.","theme":"Verbs in context","level":"B2","step":5,"note":"Legal vocabulary: a decision in favour of or against a party.","legacy":"phrasal::find for / find against"},{"type":"collocation","text":"find time","meaning":"Make room in your schedule for something.","example":"She struggled to find time for her hobbies.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::find time"},{"type":"collocation","text":"find a way","meaning":"Discover a method or a route.","example":"Let's find a way to solve this problem. The GPS helped us find our way.","theme":"Verbs in context","level":"A2","step":5,"note":"Pattern: find a way to + verb.","legacy":"phrasal::find a way"},{"type":"collocation","text":"find yourself","meaning":"Learn more about who you are and what you want.","example":"He took a year off to find himself.","theme":"Verbs in context","level":"B1","step":3,"note":"","legacy":"phrasal::find yourself"},{"type":"phrasal","text":"go about","meaning":"Begin or deal with a task in a particular way.","example":"How are you going to go about cleaning this entire room?","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::go about"},{"type":"phrasal","text":"go after","meaning":"Try to obtain or achieve something.","example":"He decided to go after that promotion at work.","theme":"Verbs in context","level":"B1","step":4,"note":"","legacy":"phrasal::go after"},{"type":"phrasal","text":"go off","meaning":"Make a sudden sound, as an alarm does; also explode.","example":"My alarm didn't go off this morning, so I was late.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::go off"},{"type":"phrasal","text":"go on","meaning":"Continue speaking or doing something.","example":"I'm sorry to interrupt. Please go on with what you were saying.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::go on"},{"type":"phrasal","text":"go through","meaning":"Experience something difficult; also examine carefully.","example":"He had to go through a lot of tests before he got the job.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::go through"},{"type":"phrasal","text":"go with","meaning":"Match or look good together.","example":"I think those shoes go with that dress.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::go with"},{"type":"phrasal","text":"go out","meaning":"Leave home for a social activity.","example":"We are going to go out for dinner tonight.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::go out"},{"type":"phrasal","text":"go under","meaning":"Fail as a business and stop operating.","example":"Unfortunately, several small businesses might go under this year.","theme":"Verbs in context","level":"B2","step":5,"note":"","legacy":"phrasal::go under"},{"type":"phrasal","text":"go over","meaning":"Review or check something carefully.","example":"Let's go over the plan one more time.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::go over"},{"type":"phrasal","text":"hang about","meaning":"Spend time somewhere without doing much.","example":"We hung about outside the café while we waited for our friends.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::hang about"},{"type":"phrasal","text":"hang around","meaning":"Stay somewhere while waiting.","example":"I'll be finished in five minutes. Do you mind hanging around for a bit?","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::hang around"},{"type":"phrasal","text":"hang in there","meaning":"Keep going through a difficult situation.","example":"I know it's stressful, but hang in there. It'll be over soon.","theme":"Verbs in context","level":"B1","step":3,"note":"","legacy":"phrasal::hang in there"},{"type":"phrasal","text":"hang on","meaning":"Wait for a short time.","example":"I'll be there soon. Just hang on a minute!","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::hang on"},{"type":"phrasal","text":"hang out","meaning":"Spend relaxed time with other people.","example":"Let's hang out this weekend.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::hang out"},{"type":"phrasal","text":"hang up","meaning":"End a phone call.","example":"Can you believe he hung up on me?! How rude!","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::hang up"},{"type":"phrasal","text":"hold on","meaning":"Wait; stay on the phone.","example":"Please hold on, I'll check for you.","theme":"Verbs in context","level":"A2","step":0,"note":"","legacy":"phrasal::hold on"},{"type":"phrasal","text":"hold up","meaning":"Delay something; also rob a place using threats.","example":"The delivery was held up by heavy traffic. The thieves held up a shop.","theme":"Verbs in context","level":"B1","step":4,"note":"The context distinguishes delaying from robbing.","legacy":"phrasal::hold up"},{"type":"phrasal","text":"hold on to","meaning":"Keep a firm grip on something; also keep a belief or hope.","example":"Hold on to your dreams and never give up.","theme":"Verbs in context","level":"B1","step":3,"note":"","legacy":"phrasal::hold on to"},{"type":"phrasal","text":"hold back","meaning":"Stop yourself from showing something, such as tears.","example":"I tried to hold back my tears.","theme":"Verbs in context","level":"B1","step":3,"note":"","legacy":"phrasal::hold back"},{"type":"phrasal","text":"hold out","meaning":"Continue resisting or surviving a difficult situation.","example":"They held out until help arrived.","theme":"Verbs in context","level":"B2","step":5,"note":"","legacy":"phrasal::hold out"},{"type":"phrasal","text":"hold in","meaning":"Keep an emotion from showing.","example":"Take a deep breath and hold in your anger.","theme":"Verbs in context","level":"B1","step":3,"note":"","legacy":"phrasal::hold in"},{"type":"phrasal","text":"hold to","meaning":"Keep following a plan or commitment.","example":"The team held to its original plan.","theme":"Verbs in context","level":"B2","step":5,"note":"","legacy":"phrasal::hold to"},{"type":"phrasal","text":"pass away","meaning":"Die; a gentler expression.","example":"I just found out that my neighbour passed away last week.","theme":"Verbs in context","level":"B1","step":3,"note":"","legacy":"phrasal::pass away"},{"type":"phrasal","text":"pass by","meaning":"Go past someone or something without stopping.","example":"He just passed us by without saying anything.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::pass by"},{"type":"phrasal","text":"pass off","meaning":"Present something as if it were something else.","example":"They gave us cheap wine and tried to pass it off as the expensive stuff!","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::pass off"},{"type":"phrasal","text":"pass on","meaning":"Give information or a message to another person.","example":"I'll pass on your kind words when I see him.","theme":"Verbs in context","level":"A2","step":3,"note":"","legacy":"phrasal::pass on"},{"type":"phrasal","text":"pass out","meaning":"Lose consciousness; also distribute things.","example":"She felt dizzy and passed out.","theme":"Verbs in context","level":"B1","step":3,"note":"Another meaning: pass out leaflets means distribute leaflets.","legacy":"phrasal::pass out"},{"type":"phrasal","text":"pass over","meaning":"Not choose or consider someone for an opportunity.","example":"He was passed over for a promotion yet again.","theme":"Verbs in context","level":"B1","step":4,"note":"","legacy":"phrasal::pass over"},{"type":"phrasal","text":"catch up","meaning":"Do work that you have fallen behind on.","example":"I need to catch up on my work after being sick.","theme":"Verbs in context","level":"B1","step":4,"note":"","legacy":"phrasal::catch up"},{"type":"phrasal","text":"catch on","meaning":"Begin to understand something.","example":"It took me a while, but I finally caught on to how the game works.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::catch on"},{"type":"phrasal","text":"catch up with","meaning":"Meet someone and share recent news; also reach someone ahead of you.","example":"Let's catch up with each other over coffee this week.","theme":"Verbs in context","level":"B1","step":3,"note":"","legacy":"phrasal::catch up with"},{"type":"phrasal","text":"catch up on","meaning":"Do something you have not had enough time to do.","example":"I want to catch up on my sleep this weekend.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::catch up on"},{"type":"phrasal","text":"catch out","meaning":"Take someone by surprise or discover a mistake.","example":"The unexpected question caught me out.","theme":"Verbs in context","level":"B2","step":5,"note":"","legacy":"phrasal::catch out"},{"type":"collocation","text":"catch sight of","meaning":"See someone or something briefly.","example":"We caught sight of a deer while hiking in the forest.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::catch sight of"},{"type":"phrasal","text":"move in","meaning":"Begin living in a new home.","example":"They will move in next week after the renovation is finished.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::move in"},{"type":"phrasal","text":"move out","meaning":"Leave the home where you have been living.","example":"She moved out of her parents' house after college.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::move out"},{"type":"phrasal","text":"move on","meaning":"Stop focusing on the past and continue with life.","example":"It's time to move on and focus on new opportunities.","theme":"Verbs in context","level":"B1","step":3,"note":"","legacy":"phrasal::move on"},{"type":"phrasal","text":"move up","meaning":"Reach a higher position at work.","example":"He moved up quickly in the company thanks to his hard work.","theme":"Verbs in context","level":"B1","step":4,"note":"","legacy":"phrasal::move up"},{"type":"phrasal","text":"move in with","meaning":"Start sharing a home with someone.","example":"They decided to move in with their friends to save money.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::move in with"},{"type":"phrasal","text":"move around","meaning":"Change position or move from place to place.","example":"The kids moved around a lot during the long car ride.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::move around"},{"type":"phrasal","text":"move away","meaning":"Leave an area to live somewhere else.","example":"He moved away to another city for a better job.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::move away"},{"type":"phrasal","text":"move back","meaning":"Return to live in a place where you lived before.","example":"We moved back to our hometown after ten years.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::move back"},{"type":"phrasal","text":"move forward","meaning":"Make progress with a plan.","example":"We need to move forward with our plans and not look back.","theme":"Verbs in context","level":"B1","step":4,"note":"","legacy":"phrasal::move forward"},{"type":"phrasal","text":"let up","meaning":"Become less strong or stop.","example":"The rain finally let up after three days.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::let up"},{"type":"phrasal","text":"let down","meaning":"Disappoint someone.","example":"I was let down by the team's poor performance.","theme":"Verbs in context","level":"B1","step":3,"note":"","legacy":"phrasal::let down"},{"type":"phrasal","text":"let in","meaning":"Allow someone or something to enter.","example":"Please let the cat in; it's cold outside.","theme":"Verbs in context","level":"A2","step":0,"note":"","legacy":"phrasal::let in"},{"type":"phrasal","text":"let on","meaning":"Reveal information that was meant to be secret.","example":"Don't let on about the surprise party!","theme":"Verbs in context","level":"B2","step":5,"note":"","legacy":"phrasal::let on"},{"type":"phrasal","text":"let out","meaning":"Allow something to leave; also make clothing wider.","example":"Please let the cat out. The tailor let out the jacket.","theme":"Verbs in context","level":"B1","step":5,"note":"Let out a jacket means make the jacket wider.","legacy":"phrasal::let out"},{"type":"phrasal","text":"let off","meaning":"Give a lighter punishment or no punishment.","example":"The policeman let the driver off with a warning.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::let off"},{"type":"phrasal","text":"get along","meaning":"Have a friendly relationship.","example":"My new roommate and I really get along well.","theme":"Verbs in context","level":"B1","step":3,"note":"","legacy":"phrasal::get along"},{"type":"phrasal","text":"get away","meaning":"Escape or leave a place.","example":"The thief tried to get away in a stolen car.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::get away"},{"type":"phrasal","text":"get by","meaning":"Manage with limited money or resources.","example":"It's hard to get by on such a small salary.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::get by"},{"type":"phrasal","text":"get down","meaning":"Make someone feel sad.","example":"This rainy weather is really starting to get me down.","theme":"Verbs in context","level":"B1","step":3,"note":"","legacy":"phrasal::get down"},{"type":"phrasal","text":"get off","meaning":"Leave a bus, train or similar vehicle.","example":"We need to get off the bus at the next stop.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::get off"},{"type":"phrasal","text":"get over","meaning":"Recover from an illness or difficult experience.","example":"It took her a long time to get over the flu.","theme":"Verbs in context","level":"B1","step":3,"note":"","legacy":"phrasal::get over"},{"type":"phrasal","text":"get through","meaning":"Finish a large or difficult amount of work.","example":"I have a lot of work to get through this weekend.","theme":"Verbs in context","level":"B1","step":4,"note":"","legacy":"phrasal::get through"},{"type":"phrasal","text":"get up","meaning":"Leave your bed after sleeping.","example":"I usually get up at 7 AM on weekdays.","theme":"Verbs in context","level":"A2","step":0,"note":"","legacy":"phrasal::get up"},{"type":"phrasal","text":"show around","meaning":"Give someone a tour of a place.","example":"When I first got here, he showed me around the town and introduced me to everyone.","theme":"Verbs in context","level":"A2","step":4,"note":"","legacy":"phrasal::show around"},{"type":"phrasal","text":"show in","meaning":"Guide someone into a room.","example":"When she arrives, please show her in and get her a coffee.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::show in"},{"type":"phrasal","text":"show off","meaning":"Try to impress other people.","example":"He always shows off in front of his friends.","theme":"Verbs in context","level":"B1","step":5,"note":"Without an object: try to impress other people.","legacy":"phrasal::show off (1)"},{"type":"phrasal","text":"show off","meaning":"Display something you feel proud of.","example":"I think he just invited us over to show off his new TV.","theme":"Verbs in context","level":"B1","step":5,"note":"With an object: display something with pride.","legacy":"phrasal::show off (2)"},{"type":"phrasal","text":"show out","meaning":"Guide someone to the exit.","example":"After a brief interview, the secretary showed him out.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::show out"},{"type":"phrasal","text":"show up","meaning":"Arrive or appear.","example":"She usually shows up about 20 minutes after everyone else.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::show up"},{"type":"phrasal","text":"keep up with","meaning":"Stay at the same speed or level as something.","example":"It's hard to keep up with all my schoolwork and activities.","theme":"Verbs in context","level":"B1","step":4,"note":"","legacy":"phrasal::keep up with"},{"type":"phrasal","text":"keep up","meaning":"Continue doing something well.","example":"You're doing great! Keep up the good work.","theme":"Verbs in context","level":"B1","step":4,"note":"","legacy":"phrasal::keep up"},{"type":"phrasal","text":"keep on","meaning":"Continue doing something.","example":"Despite the challenges, we must keep on working hard.","theme":"Verbs in context","level":"B1","step":4,"note":"","legacy":"phrasal::keep on"},{"type":"phrasal","text":"keep out","meaning":"Stay outside a place; do not enter.","example":"The sign says \"Keep out!\" It's dangerous inside.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::keep out"},{"type":"phrasal","text":"keep away","meaning":"Stay at a safe distance.","example":"Please keep away from the edge of the cliff.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::keep away"},{"type":"phrasal","text":"keep back","meaning":"Remain at a distance or behind a line.","example":"The teacher asked the students to keep back and wait their turn.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::keep back"},{"type":"collocation","text":"keep in touch","meaning":"Continue communicating with someone.","example":"We moved to different cities, but we still keep in touch.","theme":"Verbs in context","level":"A2","step":3,"note":"","legacy":"phrasal::keep in touch"},{"type":"phrasal","text":"take after","meaning":"Look or behave like a family member.","example":"She takes after her mom. They have the same smile.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::take after"},{"type":"phrasal","text":"take apart","meaning":"Separate something into its parts.","example":"He took apart the old toy to see how it worked.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::take apart"},{"type":"phrasal","text":"take back","meaning":"Return something to where you bought it.","example":"I need to take back these shoes. They don't fit.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::take back"},{"type":"phrasal","text":"take down","meaning":"Write down information that someone gives you.","example":"Could you take down the address while I read it out?","theme":"Verbs in context","level":"A2","step":4,"note":"","legacy":"phrasal::take down"},{"type":"phrasal","text":"take off","meaning":"Remove a piece of clothing; also leave the ground in an aircraft.","example":"It's hot in here. I'll take off my jacket.","theme":"Verbs in context","level":"A2","step":2,"note":"","legacy":"phrasal::take off"},{"type":"phrasal","text":"take on","meaning":"Accept a new responsibility or challenge.","example":"She took on a new project at work.","theme":"Verbs in context","level":"B1","step":4,"note":"","legacy":"phrasal::take on"},{"type":"collocation","text":"think about","meaning":"Consider a subject or possibility.","example":"I'm thinking about changing my job next year.","theme":"Verbs in context","leve erstand a small detail.","example":"She picked up on the change in his tone of voice.","theme":"Verbs in context","level":"B2","step":5,"note":"","legacy":"phrasal::pick up on"},{"type":"phrasal","text":"pick through","meaning":"Search carefully through a collection of things.","example":"We picked through the boxes to find old photos.","theme":"Verbs in context","level":"B2","step":5,"note":"","legacy":"phrasal::pick through"},{"type":"phrasal","text":"pick up after","meaning":"Tidy the things someone has left behind.","example":"Please pick up after yourself before you leave.","theme":"Verbs in context","level":"B1","step":5,"note":"","legacy":"phrasal::pick up after"},{"type":"collocation","text":"look at","meaning":"Direct your eyes towards something.","example":"Look at this chart.","theme":"Verbs and prepositions","level":"A1","step":0,"note":"","legacy":"collocation::look at"},{"type":"collocation","text":"laugh at","meaning":"Show amusement at something.","example":"They laughed at the joke.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::laugh at"},{"type":"collocation","text":"smile at","meaning":"Give someone a friendly expression with your mouth.","example":"She smiled at me.","theme":"Verbs and prepositions","level":"A1","step":0,"note":"","legacy":"collocation::smile at"},{"type":"collocation","text":"shout at","meaning":"Speak loudly and angrily to someone.","example":"Don't shout at your brother.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::shout at"},{"type":"collocation","text":"stare at","meaning":"Look at something for a long time without looking away.","example":"He stared at the screen.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"","legacy":"collocation::stare at"},{"type":"collocation","text":"point at","meaning":"Show a direction with your finger.","example":"She pointed at the map.","theme":"Verbs and prepositions","level":"A2","step":1," n with someone.","example":"We communicate with funders by email.","theme":"Verbs and prepositions","level":"B1","step":4,"note":"","legacy":"collocation::communicate with"},{"type":"collocation","text":"cope with","meaning":"Manage a difficult situation.","example":"He copes with stress well.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"","legacy":"collocation::cope with"},{"type":"collocation","text":"think about","meaning":"Consider something carefully.","example":"I'm thinking about my next steps.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::think about"},{"type":"collocation","text":"talk about","meaning":"Discuss a subject.","example":"We talked about the budget.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::talk about"},{"type":"collocation","text":"worry about","meaning":"Feel anxious about something.","example":"Don't worry about the deadline.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"","legacy":"collocation::worry about"},{"type":"collocation","text":"ask about","meaning":"Request information about a subject.","example":"He asked about the funding.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::ask about"},{"type":"collocation","text":"learn about","meaning":"Gain knowledge about a subject.","example":"I want to learn about grants.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::learn about"},{"type":"collocation","text":"dream about","meaning":"Experience images or events while sleeping.","example":"I dreamed about the trip.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"","legacy":"collocation::dream about"},{"type":"collocation","text":"complain about","meaning":"Express dissatisfaction with something.","example":"She complained about the delay.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocati e":"","legacy":"collocation::invest in"},{"type":"collocation","text":"depend on","meaning":"Need something or be affected by it.","example":"It depends on the funding.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::depend on"},{"type":"collocation","text":"insist on","meaning":"Say firmly that something must happen.","example":"He insisted on paying.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"","legacy":"collocation::insist on"},{"type":"collocation","text":"focus on","meaning":"Give your attention to something.","example":"Let's focus on the priorities.","theme":"Verbs and prepositions","level":"B1","step":4,"note":"","legacy":"collocation::focus on"},{"type":"collocation","text":"rely on","meaning":"Trust someone or something to provide help.","example":"We rely on volunteers.","theme":"Verbs and prepositions","level":"B1","step":4,"note":"","legacy":"collocation::rely on"},{"type":"collocation","text":"agree on","meaning":"Reach a shared decision about something.","example":"We agreed on a date.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::agree on"},{"type":"collocation","text":"work on","meaning":"Spend time developing or improving something.","example":"We are working on a proposal.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::work on"},{"type":"collocation","text":"comment on","meaning":"Give an opinion about something.","example":"Please comment on the draft.","theme":"Verbs and prepositions","level":"B1","step":4,"note":"","legacy":"collocation::comment on"},{"type":"collocation","text":"decide on","meaning":"Choose one of several possibilities.","example":"They decided on the second option.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"","legacy":"collocation::decide on"},{"type":"collocation","text":"apply for","meaning":"Make a formal request for something.","example":"We applied for a grant.","theme":"Verbs and prepositions","level":"A2","step":4,"note":"","legacy":"collocation::apply for"},{"type":"collocation","text":"ask for","meaning":"Request something you need or want.","example":"She asked for help.","theme":"Verbs and prepositions","level":"A1","step":0,"note":"","legacy":"collocation::ask for"},{"type":"collocation","text":"search for","meaning":"Try to find something.","example":"He searched for a solution.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::search for"},{"type":"collocation","text":"wait for","meaning":"Stay until someone or something is ready or arrives.","example":"I'm waiting for an answer.","theme":"Verbs and prepositions","level":"A1","step":0,"note":"","legacy":"collocation::wait for"},{"type":"collocation","text":"prepare for","meaning":"Get ready for an event or task.","example":"Prepare for the meeting.","theme":"Verbs and prepositions","level":"A2","step":4,"note":"","legacy":"collocation::prepare for"},{"type":"collocation","text":"pay for","meaning":"Give money in exchange for something.","example":"Who pays for the training?","theme":"Verbs and prepositions","level":"A1","step":1,"note":"","legacy":"collocation::pay for"},{"type":"collocation","text":"care for","meaning":"Look after someone’s needs.","example":"She cares for her mother.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::care for"},{"type":"collocation","text":"look for","meaning":"Try to find something or someone.","example":"We are looking for funding.","theme":"Verbs and prepositions","level":"A1","step":0,"note":"","legacy":"collocation::look for"},{"type":"phrasal","text":"break down","meaning":"Stop working, as a machine or vehicle does.","example":"The photocopier broke down this morning.","theme":"Useful phrasal verbs","level":"A2","step":2,"note":"","legacy":"phrasal::break down"},{"type":"phrasal","text":"bring up","meaning":"Introduce a topic into a conversation.","example":"She brought up the budget during the meeting.","theme":"Useful phrasal verbs","level":"B1","step":4,"note":"","legacy":"phrasal::bring up"},{"type":"phrasal","text":"call off","meaning":"Cancel an event or plan.","example":"They called off the event.","theme":"Useful phrasal verbs","level":"A2","step":4,"note":"","legacy":"phrasal::call off"},{"type":"phrasal","text":"carry on","meaning":"Continue doing something.","example":"Please carry on with your work.","theme":"Useful phrasal verbs","level":"B1","step":5,"note":"","legacy":"phrasal::carry on"},{"type":"phrasal","text":"come across","meaning":"Find something by chance.","example":"I came across an old report.","theme":"Useful phrasal verbs","level":"B1","step":5,"note":"","legacy":"phrasal::come across"},{"type":"phrasal","text":"cut off","meaning":"Lose a phone connection or be disconnected.","example":"We were cut off during the call.","theme":"Useful phrasal verbs","level":"A2","step":2,"note":"","legacy":"phrasal::cut off"},{"type":"phrasal","text":"drop by","meaning":"Visit someone briefly and informally.","example":"I'll drop by your office tomorrow.","theme":"Useful phrasal verbs","level":"B1","step":5,"note":"","legacy":"phrasal::drop by"},{"type":"phrasal","text":"figure out","meaning":"Understand or solve a problem.","example":"We need to figure out the problem.","theme":"Useful phrasal verbs","level":"B1","step":5,"note":"","legacy":"phrasal::figure out"},{"type":"phrasal","text":"find out","meaning":"Discover information.","example":"I found out the deadline.","theme":"Useful phrasal verbs","level":"B1","step":5,"note":"","legacy":"phrasal::find out"},{"type":"phrasal","text":"get along","meaning":"Have a friendly relationship.","example":"They get along well.","theme":"Useful phrasal verbs","level":"B1","step":3,"note":"","legacy":"phrasal::get along"},{"type":"phrasal","text":"give up","meaning":"Stop trying; abandon an effort.","example":"Don't give up.","theme":"Useful phrasal verbs","level":"A2","step":3,"note":"","legacy":"phrasal::give up"},{"type":"phrasal","text":"go on","meaning":"Continue speaking or doing something.","example":"Go on, I'm listening.","theme":"Useful phrasal verbs","level":"B1","step":5,"note":"","legacy":"phrasal::go on"},{"type":"phrasal","text":"look after","meaning":"Take care of someone.","example":"She looks after the children.","theme":"Useful phrasal verbs","level":"A2","step":2,"note":"","legacy":"phrasal::look after"},{"type":"phrasal","text":"look forward to","meaning":"Feel pleased about something that will happen.","example":"I look forward to meeting you.","theme":"Useful phrasal verbs","level":"B1","step":4,"note":"Use look forward to + noun or -ing form.","legacy":"phrasal::look forward to"},{"type":"phrasal","text":"make up","meaning":"Invent a story; also become friendly again after an argument.","example":"He made up a story.","theme":"Useful phrasal verbs","level":"B1","step":5,"note":"","legacy":"phrasal::make up"},{"type":"phrasal","text":"pick up","meaning":"Lift something; collect something; also learn informally.","example":"She picked up English quickly.","theme":"Useful phrasal verbs","level":"B1","step":5,"note":"","legacy":"phrasal::pick up"},{"type":"phrasal","text":"put off","meaning":"Delay something until a later time.","example":"They put off the meeting.","theme":"Useful phrasal verbs","level":"B1","step":4,"note":"","legacy":"phrasal::put off"},{"type":"phrasal","text":"run into","meaning":"Meet someone unexpectedly.","example":"I ran into a former colleague.","theme":"Useful phrasal verbs","level":"B1","step":4,"note":"","legacy":"phrasal::run into"},{"type":"phrasal","text":"set up","meaning":"Organize or establish something.","example":"We set up a new program.","theme":"Useful phrasal verbs","level":"B1","step":4,"note":"","legacy":"phrasal::set up"},{"type":"phrasal","text":"turn down","meaning":"Refuse an offer; also reduce sound or heat.","example":"He turned down the offer.","theme":"Useful phrasal verbs","level":"B1","step":4,"note":"","legacy":"phrasal::turn down"},{"type":"expr","text":"It doesn’t matter","meaning":"The result or detail is not important.","example":"It doesn’t matter if we start a little later.","theme":"Choices and possibilities","level":"A2","step":5,"note":"","legacy":"expr::Peu importe"},{"type":"expr","text":"no matter who","meaning":"The person involved does not change the situation.","example":"I will listen, no matter who is speaking.","theme":"Choices and possibilities","level":"B1","step":5,"note":"","legacy":"expr::Peu importe qui"},{"type":"expr","text":"no matter what","meaning":"Whatever happens, the situation remains the same.","example":"We will keep trying, no matter what happens.","theme":"Choices and possibilities","level":"B1","step":5,"note":"","legacy":"expr::Peu importe quoi"},{"type":"expr","text":"no matter where","meaning":"The place does not change the situation.","example":"You can practise, no matter where you live.","theme":"Choices and possibilities","level":"B1","step":5,"note":"","legacy":"expr::Peu importe où"},{"type":"expr","text":"no matter when","meaning":"The time does not change the situation.","example":"Call me, no matter when you arrive.","theme":"Choices and possibilities","level":"B1","step":5,"note":"","legacy":"expr::Peu importe quand"},{"type":"expr","text":"no matter how","meaning":"The method or degree does not change the situation.","example":"Keep trying, no matter how difficult it seems.","theme":"Choices and possibilities","level":"B1","step":5,"note":"","legacy":"expr::Peu importe comment"},{"type":"expr","text":"no matter which","meaning":"The option chosen does not change the situation.","example":"The price is the same, no matter which colour you choose.","theme":"Choices and possibilities","level":"B1","step":5,"note":"","legacy":"expr::Peu importe lequel"},{"type":"expr","text":"whoever","meaning":"Any person who does something.","example":"Whoever fini
