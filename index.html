ing":"In the direction of a place.","example":"He walked toward the station.","theme":"Directions and movement","level":"A2","step":2,"note":"","legacy":"word::toward"},{"type":"word","text":"forward","meaning":"Towards the front or towards progress.","example":"We need to move forward.","theme":"Directions and movement","level":"A2","step":2,"note":"","legacy":"word::forward"},{"type":"word","text":"upward","meaning":"Towards a higher position.","example":"Prices are moving upward.","theme":"Directions and movement","level":"A2","step":2,"note":"","legacy":"word::upward"},{"type":"word","text":"downward","meaning":"Towards a lower position.","example":"The trend is downward.","theme":"Directions and movement","level":"A2","step":2,"note":"","legacy":"word::downward"},{"type":"word","text":"backward","meaning":"Towards the back or an earlier position.","example":"Don't look backward.","theme":"Directions and movement","level":"A2","step":2,"note":"","legacy":"word::backward"},{"type":"word","text":"afterward","meaning":"At a later time.","example":"Afterward, we had lunch.","theme":"Directions and movement","level":"A2","step":2,"note":"","legacy":"word::afterward"},{"type":"word","text":"inward","meaning":"Towards the inside.","example":"The door opens inward.","theme":"Directions and movement","level":"B1","step":2,"note":"","legacy":"word::inward"},{"type":"word","text":"outward","meaning":"Towards the outside.","example":"The doors open outward.","theme":"Directions and movement","level":"B1","step":2,"note":"","legacy":"word::outward"},{"type":"word","text":"leftward","meaning":"Towards the left.","example":"The path turns leftward.","theme":"Directions and movement","level":"B1","step":2,"note":"","legacy":"word::leftward"},{"type":"word","text":"rightward","meaning":"Towards the right.","example":"The path turns rightward.","theme":"Directions and movement","level":"B1","step":2,"note":"","legacy":"word::rightward"},{"type":"word","text":"northward","meaning":"Towards the north.","example":"The birds fly northward.","theme":"Directions and movement","level":"B1","step":2,"note":"","legacy":"word::northward"},{"type":"word","text":"southward","meaning":"Towards the south.","example":"They traveled southward.","theme":"Directions and movement","level":"B1","step":2,"note":"","legacy":"word::southward"},{"type":"word","text":"eastward","meaning":"Towards the east.","example":"The river flows eastward.","theme":"Directions and movement","level":"B1","step":2,"note":"","legacy":"word::eastward"},{"type":"collocation","text":"talk to","meaning":"Have a conversation with someone.","example":"I talked to the director yesterday.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::talk to"},{"type":"collocation","text":"explain something to someone","meaning":"Make something clear to another person.","example":"She explained the process to the family.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::explain to"},{"type":"collocation","text":"introduce someone to","meaning":"Present someone to another person for the first time.","example":"He introduced me to the funder.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::introduce to"},{"type":"collocation","text":"congratulate someone on","meaning":"Tell someone you are pleased about their achievement.","example":"We congratulated her on the award.","theme":"Verbs and prepositions","level":"B1","step":4,"note":"","legacy":"collocation::congratulate on"},{"type":"collocation","text":"concentrate on","meaning":"Give your full attention to something.","example":"Please concentrate on the task.","theme":"Verbs and prepositions","level":"B1","step":4,"note":"","legacy":"collocation::concentrate on"},{"type":"collocation","text":"involve someone in","meaning":"Include someone in an activity.","example":"They involve parents in the program.","theme":"Verbs and prepositions","level":"B1","step":4,"note":"","legacy":"collocation::involve in"},{"type":"collocation","text":"succeed in","meaning":"Achieve something you have tried to do.","example":"We succeeded in getting the grant.","theme":"Verbs and prepositions","level":"B1","step":4,"note":"","legacy":"collocation::succeed in"},{"type":"collocation","text":"thank someone for","meaning":"Express appreciation for something someone has done.","example":"I thank you for your help.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::thank for"},{"type":"collocation","text":"admire someone for","meaning":"Respect someone because of a quality or action.","example":"We admire her for her courage.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"","legacy":"collocation::admire for"},{"type":"collocation","text":"protect someone from","meaning":"Keep someone safe from harm.","example":"We protect children from harm.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"","legacy":"collocation::protect from"},{"type":"collocation","text":"graduate from","meaning":"Successfully complete a course of study at an institution.","example":"She graduated from university in 2020.","theme":"Verbs and prepositions","level":"B1","step":4,"note":"","legacy":"collocation::graduate from"},{"type":"collocation","text":"borrow from","meaning":"Receive something temporarily from someone.","example":"He borrowed money from the bank.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::borrow from"},{"type":"collocation","text":"separate from","meaning":"Keep one thing apart from another.","example":"Separate the files from the notes.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"","legacy":"collocation::separate from"},{"type":"collocation","text":"escape from","meaning":"Get away from danger or confinement.","example":"They escaped from danger.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"","legacy":"collocation::escape from"},{"type":"collocation","text":"recover from","meaning":"Become well again after an illness or difficulty.","example":"He recovered from the illness.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"","legacy":"collocation::recover from"},{"type":"collocation","text":"forget about","meaning":"Fail to remember something.","example":"Don't forget about the deadline.","theme":"Verbs and prepositions","level":"A2","step":1,"note":"","legacy":"collocation::forget about"},{"type":"collocation","text":"argue about","meaning":"Disagree about a subject, often angrily.","example":"They argued about the budget.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"","legacy":"collocation::argue about"},{"type":"expr","text":"who","meaning":"A relative pronoun used for people, often as the subject.","example":"He is the boy who won the prize.","theme":"Relative pronouns","level":"B1","step":1,"note":"","legacy":"expr::who"},{"type":"expr","text":"whom","meaning":"A formal relative pronoun used for a person receiving an action.","example":"This is the boy whom I met.","theme":"Relative pronouns","level":"B2","step":1,"note":"Whom is mainly formal. Who is common in speech for the object of a clause.","legacy":"expr::whom"},{"type":"expr","text":"whose","meaning":"A relative pronoun showing possession.","example":"She is the girl whose father is a doctor.","theme":"Relative pronouns","level":"B1","step":1,"note":"","legacy":"expr::whose"},{"type":"expr","text":"which","meaning":"A relative pronoun used for things and animals.","example":"This is the book which I bought.","theme":"Relative pronouns","level":"B1","step":1,"note":"","legacy":"expr::which"},{"type":"expr","text":"that","meaning":"A relative pronoun used for people or things in defining clauses.","example":"This is the car that he drives.","theme":"Relative pronouns","level":"B1","step":1,"note":"","legacy":"expr::that"},{"type":"expr","text":"what","meaning":"The thing or things that; no separate noun comes before it.","example":"Tell me what you want.","theme":"Relative pronouns","level":"B1","step":1,"note":"","legacy":"expr::what"},{"type":"expr","text":"whoever","meaning":"Any person who.","example":"Whoever comes early will get a seat.","theme":"Relative pronouns","level":"B1","step":1,"note":"","legacy":"expr::whoever"},{"type":"expr","text":"whichever","meaning":"Any one of the available choices.","example":"You can take whichever book you like.","theme":"Relative pronouns","level":"B1","step":1,"note":"","legacy":"expr::whichever"},{"type":"word","text":"at","meaning":"At a specific place or time.","example":"I am at home.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::at"},{"type":"word","text":"in","meaning":"Inside a place or space.","example":"She is in the room.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::in"},{"type":"word","text":"on","meaning":"On the surface of something.","example":"The book is on the table.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::on"},{"type":"word","text":"by","meaning":"Near or next to something.","example":"He sat by the window.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::by"},{"type":"word","text":"for","meaning":"Over a period of time.","example":"I have lived here for 2 years.","theme":"Everyday prepositions","level":"A2","step":1,"note":"","legacy":"collocation::for"},{"type":"word","text":"with","meaning":"Together with someone or something.","example":"She went with her friend.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::with"},{"type":"word","text":"about","meaning":"On the subject of something.","example":"We talked about the plan.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::about"},{"type":"word","text":"to","meaning":"Towards a destination.","example":"He is going to school.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::to"},{"type":"word","text":"from","meaning":"Starting at or coming from a place or person.","example":"The gift is from my sister.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::from"},{"type":"word","text":"of","meaning":"Connecting a thing to what it belongs to or describes.","example":"This is a photo of my family.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::of"},{"type":"word","text":"over","meaning":"Above something or moving across it.","example":"The plane flew over the city.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::over"},{"type":"word","text":"under","meaning":"In a lower position, beneath something.","example":"The cat is under the chair.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::under"},{"type":"word","text":"between","meaning":"In the space separating distinct things.","example":"The café is between the bank and the library.","theme":"Everyday prepositions","level":"A1","step":0,"note":"Between can also connect more than two items considered individually.","legacy":"collocation::between"},{"type":"word","text":"into","meaning":"Moving from outside to inside.","example":"He jumped into the pool.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::into"},{"type":"word","text":"out of","meaning":"Moving from inside to outside.","example":"She came out of the room.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::out of"},{"type":"word","text":"near","meaning":"Not far from something.","example":"There is a park near my house.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::near"},{"type":"word","text":"behind","meaning":"At the back of something.","example":"The car is behind the bus.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::behind"},{"type":"word","text":"before","meaning":"Earlier than an event or time.","example":"Wash your hands before eating.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::before"},{"type":"word","text":"after","meaning":"Later than an event or time.","example":"We will meet after the class.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::after"},{"type":"word","text":"during","meaning":"Throughout or at some point within an event or period.","example":"Stay calm during the test.","theme":"Everyday prepositions","level":"A1","step":0,"note":"","legacy":"collocation::during"},{"type":"expr","text":"First of all","meaning":"Used to introduce your first point.","example":"First of all, I would like to thank you.","theme":"Organize your ideas","level":"A2","step":3,"note":"","legacy":"expr::First of all"},{"type":"expr","text":"As a matter of fact","meaning":"Used to introduce a fact or correction.","example":"As a matter of fact, we met last year.","theme":"Organize your ideas","level":"B1","step":3,"note":"","legacy":"expr::As a matter of fact"},{"type":"expr","text":"In other words","meaning":"Used to explain the same idea in a different way.","example":"In other words, we need more funding.","theme":"Organize your ideas","level":"B1","step":3,"note":"","legacy":"expr::In other words"},{"type":"expr","text":"For instance","meaning":"Used to introduce an example.","example":"For instance, we offer workshops.","theme":"Organize your ideas","level":"B1","step":3,"note":"","legacy":"expr::For instance"},{"type":"expr","text":"In particular","meaning":"Especially; focusing on one specific thing.","example":"We need volunteers, in particular for events.","theme":"Organize your ideas","level":"B1","step":3,"note":"","legacy":"expr::In particular"},{"type":"expr","text":"In general","meaning":"Usually or considering most cases.","example":"In general, the program works well.","theme":"Organize your ideas","level":"A2","step":3,"note":"","legacy":"expr::In general"},{"type":"expr","text":"On the one hand","meaning":"Used to introduce one side of a comparison.","example":"On the one hand, it is affordable.","theme":"Organize your ideas","level":"B2","step":3,"note":"","legacy":"expr::On the one hand"},{"type":"expr","text":"On the other hand","meaning":"Used to introduce the other side of a comparison.","example":"On the other hand, it takes time.","theme":"Organize your ideas","level":"B2","step":3,"note":"","legacy":"expr::On the other hand"},{"type":"expr","text":"In the same way","meaning":"Using a similar method or approach.","example":"In the same way, we support families.","theme":"Organize your ideas","level":"B1","step":3,"note":"","legacy":"expr::In the same way"},{"type":"expr","text":"In contrast","meaning":"Used to introduce a difference.","example":"In contrast, last year was quiet.","theme":"Organize your ideas","level":"B2","step":3,"note":"","legacy":"expr::In contrast"},{"type":"expr","text":"On the contrary","meaning":"Used to state that the opposite is true.","example":"On the contrary, it was a success.","theme":"Organize your ideas","level":"B1","step":3,"note":"","legacy":"expr::On the contrary"},{"type":"expr","text":"As a result","meaning":"Used to introduce a consequence.","example":"As a result, we hired more staff.","theme":"Organize your ideas","level":"B1","step":3,"note":"","legacy":"expr::As a result"},{"type":"expr","text":"Therefore","meaning":"For that reason; as a logical result.","example":"Therefore, we will apply again.","theme":"Organize your ideas","level":"B2","step":3,"note":"","legacy":"expr::Therefore"},{"type":"expr","text":"To be honest","meaning":"Used to introduce an honest opinion.","example":"To be honest, I was nervous.","theme":"Organize your ideas","level":"A2","step":3,"note":"","legacy":"expr::To be honest"},{"type":"expr","text":"To tell the truth","meaning":"Used to introduce an honest statement or admission.","example":"To tell the truth, I forgot.","theme":"Organize your ideas","level":"A2","step":3,"note":"","legacy":"expr::To tell the truth"},{"type":"word","text":"speak","meaning":"Use your voice to express words.","example":"I speak English with my neighbour.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: talk, chat, converse, communicate, discuss. Discuss usually takes a direct object: discuss a topic. Choose according to meaning and sentence structure.","legacy":"word::speak"},{"type":"word","text":"walk","meaning":"Move on foot at a normal pace.","example":"We walk to the station every morning.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: stroll, wander, march, hike, roam. Stroll means walk casually; hike usually means a longer walk outdoors. These are not interchangeable in every context.","legacy":"word::walk"},{"type":"word","text":"look","meaning":"Direct your eyes towards something.","example":"Look at the timetable.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: glance, gaze, stare, peek, observe. Glance means look briefly; stare means look fixedly. Choose according to the intended meaning.","legacy":"word::look"},{"type":"word","text":"think","meaning":"Use your mind to consider an idea.","example":"Let me think about your suggestion.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: consider, imagine, reflect, analyze, ponder. Imagine forms a mental picture; consider examines a possibility.","legacy":"word::think"},{"type":"word","text":"help","meaning":"Make a task easier for someone.","example":"Could you help me with this form?","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: assist, support, guide, aid, encourage. Encourage means give confidence, which is not always the same as helping with a task.","legacy":"word::help"},{"type":"word","text":"buy","meaning":"Pay money to obtain something.","example":"I need to buy a notebook.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: purchase, order, grab, pick up, acquire. Purchase is more formal; order means request goods or services.","legacy":"word::buy"},{"type":"word","text":"show","meaning":"Make something visible or demonstrate it.","example":"Could you show me how it works?","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: display, reveal, present, demonstrate, exhibit. Demonstrate can mean show how something works.","legacy":"word::show"},{"type":"word","text":"start","meaning":"Begin an activity.","example":"We start at nine.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: begin, launch, kick off, initiate, commence. Launch works well for starting a project.","legacy":"word::start"},{"type":"word","text":"end","meaning":"Bring something to a finish.","example":"The meeting will end at noon.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: finish, complete, conclude, wrap up, stop. Stopping does not always mean completing the task.","legacy":"word::end"},{"type":"word","text":"ask","meaning":"Request information or something you need.","example":"May I ask you a question?","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: inquire, request, question, seek, wonder. Request asks for something; wonder describes a question in your mind.","legacy":"word::ask"},{"type":"word","text":"answer","meaning":"Give a reply to a question or message.","example":"Please answer the email.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: reply, respond, explain, clarify, react. Clarify means make something clearer; reply means give an answer.","legacy":"word::answer"},{"type":"word","text":"change","meaning":"Make something different.","example":"Can we change the meeting time?","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: modify, improve, adjust, transform, replace. Improve means make better; not every change is an improvement.","legacy":"word::change"},{"type":"word","text":"build","meaning":"Make something by putting parts together.","example":"They plan to build a new library.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: create, construct, develop, produce, design. Design means plan the form; construct means build it.","legacy":"word::build"},{"type":"word","text":"break","meaning":"Damage something so it separates or stops working.","example":"Be careful not to break the glass.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: damage, crack, smash, shatter, split. Crack means develop a narrow break; shatter means break into many pieces.","legacy":"word::break"},{"type":"word","text":"win","meaning":"Succeed in a contest or receive a prize.","example":"Our team hopes to win the match.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: succeed, triumph, achieve, conquer, prevail. Say win a prize, achieve a goal and succeed in doing something.","legacy":"word::win"},{"type":"word","text":"lose","meaning":"No longer have something or be unable to find it.","example":"I do not want to lose my keys.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: miss, fail, drop, forfeit, misplace. Misplace means put something somewhere and be unable to find it; fail means not succeed.","legacy":"word::lose"},{"type":"word","text":"fix","meaning":"Repair something or solve a problem.","example":"Can you fix the broken chair?","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: repair, mend, restore, correct, resolve. Repair is used for an object; resolve is used for a problem.","legacy":"word::fix"},{"type":"word","text":"move","meaning":"Change position or place of residence.","example":"We plan to move to another neighbourhood.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: shift, relocate, transfer, travel, slide. Relocate means move to another place; slide describes smooth movement along a surface.","legacy":"word::move"},{"type":"word","text":"learn","meaning":"Gain knowledge or a skill.","example":"I learn a few new words every day.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: study, master, discover, practise, explore. Studying and practising help you learn; mastering means becoming highly skilled.","legacy":"word::learn"},{"type":"word","text":"grow","meaning":"Become larger or develop over time.","example":"The plants grow quickly in spring.","theme":"Choose words in context","level":"B2","step":5,"note":"Related words: develop, expand, increase, improve, progress. Increase means become greater; expand often means spread or become larger.","legacy":"word::grow"},{"type":"word","text":"at","meaning":"At a particular point or location.","example":"The bus stops at the corner.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::at"},{"type":"word","text":"in","meaning":"Inside something.","example":"My keys are in my bag.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::in"},{"type":"word","text":"on","meaning":"Resting on a surface.","example":"The book is on the desk.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::on"},{"type":"word","text":"under","meaning":"Beneath something.","example":"The shoes are under the bed.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::under"},{"type":"word","text":"over","meaning":"Above something.","example":"A lamp hangs over the table.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::over"},{"type":"word","text":"between","meaning":"Separating distinct items or places.","example":"The café is between the bank and the library.","theme":"Position and movement","level":"A2","step":2,"note":"Not limited to two: between can distinguish several separate items.","legacy":"collocation::between"},{"type":"word","text":"among","meaning":"Within a group of people or things.","example":"I found my keys among the papers.","theme":"Position and movement","level":"A2","step":2,"note":"Among places someone or something within a group.","legacy":"collocation::among"},{"type":"word","text":"around","meaning":"On all sides of something or following its edge.","example":"We walked around the lake.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::around"},{"type":"word","text":"into","meaning":"Moving towards the inside.","example":"She walked into the room.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::into"},{"type":"word","text":"upon","meaning":"On; a more formal alternative.","example":"The book rested upon the table.","theme":"Position and movement","level":"B2","step":2,"note":"Upon is more formal than on. On is sufficient in this example.","legacy":"collocation::upon"},{"type":"word","text":"towards","meaning":"In the direction of something.","example":"We walked towards the station.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::towards"},{"type":"word","text":"through","meaning":"Moving inside something from one side to the other.","example":"The train went through the tunnel.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::through"},{"type":"word","text":"along","meaning":"Following the length or direction of something.","example":"We walked along the river.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::along"},{"type":"word","text":"across","meaning":"Moving from one side to the opposite side.","example":"Use the crossing to walk across the road.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::across"},{"type":"word","text":"from ... to","meaning":"Connecting a starting point and a destination.","example":"The bus runs from the station to the hospital.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::from ... to"},{"type":"word","text":"before","meaning":"Earlier than a particular time.","example":"Please arrive before noon.","theme":"Position and movement","level":"A2","step":2,"note":"For a position ahead of something, usually use in front of.","legacy":"collocation::before"},{"type":"word","text":"behind","meaning":"At the back of something.","example":"The garden is behind the house.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::behind"},{"type":"word","text":"away","meaning":"At a distance from a place.","example":"The station is two kilometres away.","theme":"Position and movement","level":"A2","step":2,"note":"Away is an adverb. Use away from + place.","legacy":"collocation::away"},{"type":"word","text":"out of","meaning":"Moving from the inside to the outside.","example":"He took his phone out of his pocket.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::out of"},{"type":"word","text":"within","meaning":"Inside the limits of an area.","example":"Please stay within the marked area.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::within"},{"type":"word","text":"beside","meaning":"Next to someone or something.","example":"Sit beside me.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::beside"},{"type":"word","text":"above","meaning":"Higher than something.","example":"The apartment is above the shop.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::above"},{"type":"word","text":"below","meaning":"Lower than something.","example":"The temperature is below zero.","theme":"Position and movement","level":"A2","step":2,"note":"","legacy":"collocation::below"},{"type":"word","text":"important","meaning":"Having value or a significant effect.","example":"This issue is crucial for our funders.","theme":"Vocabulary nuances","level":"B2","step":5,"note":"Compare in context: crucial, significant, vital, essential, paramount, key, fundamental. Crucial and vital express strong importance.","legacy":"word::important"},{"type":"word","text":"problem","meaning":"A difficulty that needs attention.","example":"We face a major challenge this year.","theme":"Vocabulary nuances","level":"B2","step":5,"note":"Compare in context: issue, difficulty, challenge, dilemma, complication, obstacle, predicament. A dilemma involves a difficult choice.","legacy":"word::problem"},{"type":"word","text":"solution","meaning":"An answer or way to deal with a problem.","example":"We need a new approach.","theme":"Vocabulary nuances","level":"B2","step":5,"note":"Compare in context: answer, remedy, approach, resolution, fix, strategy, way out. An approach is a method, not necessarily a solution.","legacy":"word::solution"},{"type":"word","text":"effect / result","meaning":"A change or outcome caused by something.","example":"The impact of the program was positive.","theme":"Vocabulary nuances","level":"B2","step":5,"note":"Compare in context: outcome, consequence, impact, result, implication, repercussion, ramification. Impact emphasizes influence; result describes an outcome.","legacy":"word::effect / result"},{"type":"word","text":"to increase","meaning":"Become greater or make something greater.","example":"We want to boost our capacity.","theme":"Vocabulary nuances","level":"B2","step":5,"note":"Compare in context: raise, boost, enhance, augment, amplify, escalate, grow. Raise takes an object; increase can be used with or without an object.","legacy":"word::to increase"},{"type":"word","text":"to decrease","meaning":"Become smaller or make something smaller.","example":"Costs declined last year.","theme":"Vocabulary nuances","level":"B2","step":5,"note":"Compare in context: reduce, decline, diminish, lower, curtail, lessen, shrink. Reduce often takes an object; decline often does not in this sense.","legacy":"word::to decrease"},{"type":"word","text":"to show","meaning":"Make something visible or clear.","example":"The report demonstrates the need.","theme":"Vocabulary nuances","level":"B2","step":5,"note":"Compare in context: demonstrate, illustrate, indicate, reveal, depict, exhibit, clarify. Reveal makes something previously hidden known; illustrate explains through examples or images.","legacy":"word::to show"},{"type":"word","text":"to improve","meaning":"Make something better.","example":"We refine our services every year.","theme":"Vocabulary nuances","level":"B2","step":5,"note":"Compare in context: enhance, better, advance, develop, refine, upgrade, strengthen. Upgrade suggests a better version or quality.","legacy":"word::to improve"},{"type":"word","text":"good","meaning":"Of a positive or satisfactory quality.","example":"This is a beneficial program.","theme":"Vocabulary nuances","level":"B2","step":5,"note":"Compare in context: excellent, outstanding, beneficial, positive, favourable, advantageous, desirable. Beneficial means helpful; excellent indicates very high quality.","legacy":"word::good"},{"type":"word","text":"bad","meaning":"Of a negative or unsatisfactory quality.","example":"Poor housing is detrimental to health.","theme":"Vocabulary nuances","level":"B2","step":5,"note":"Compare in context: poor, detrimental, harmful, unfavourable, negative, adverse, undesirable. Harmful causes damage; poor can describe low quality.","legacy":"word::bad"},{"type":"word","text":"people","meaning":"Human beings considered together.","example":"Individuals in the community need support.","theme":"Vocabulary nuances","level":"B2","step":5,"note":"Compare in context: individuals, people, persons, human beings, members, population, public. Population and public refer to particular groups; persons is often formal.","legacy":"word::people"},{"type":"word","text":"society","meaning":"People living together within shared systems and institutions.","example":"The community supports newcomers.","theme":"Vocabulary nuances","level":"B2","step":5,"note":"Compare in context: community, population, public, civilization, culture, nation, collective. Society, culture and community describe different concepts.","legacy":"word::society"},{"type":"pattern","text":"adverb of manner","meaning":"An adverb describing how an action happens.","example":"She speaks slowly.","theme":"Adverbs","level":"A2","step":1,"note":"slowly, carefully, well, quickly","legacy":"word::adverb of manner"},{"type":"pattern","text":"adverb of place","meaning":"An adverb describing where something happens.","example":"The families live nearby.","theme":"Adverbs","level":"A2","step":1,"note":"here, there, nearby, outside","legacy":"word::adverb of place"},{"type":"pattern","text":"adverb of time","meaning":"An adverb describing when something happens.","example":"We met the funder yesterday.","theme":"Adverbs","level":"A2","step":1,"note":"now, yesterday, soon, already, yet","legacy":"word::adverb of time"},{"type":"pattern","text":"adverb of frequency","meaning":"An adverb describing how often something happens.","example":"I always send a follow-up email.","theme":"Adverbs","level":"A2","step":1,"note":"Always, usually and often normally come before the main verb and after be. Other positions are possible.","legacy":"word::adverb of frequency"},{"type":"pattern","text":"adverb of degree","meaning":"An adverb describing how much or how strongly.","example":"The program is extremely useful.","theme":"Adverbs","level":"B1","step":1,"note":"very, quite, extremely, too, almost","legacy":"word::adverb of degree"},{"type":"pattern","text":"adverb of affirmation","meaning":"An adverb expressing certainty or agreement.","example":"Certainly, we will help.","theme":"Adverbs","level":"B2","step":1,"note":"certainly, definitely, surely, obviously","legacy":"word::adverb of affirmation"},{"type":"pattern","text":"adverb of negation","meaning":"Words expressing negation or an almost zero amount.","example":"He never called back.","theme":"Adverbs","level":"B1","step":1,"note":"Not and never express negation. Hardly and barely mean almost not, rather than an absolute negative.","legacy":"word::adverb of negation"},{"type":"pattern","text":"interrogative adverb","meaning":"An adverb used to ask a question.","example":"When is the deadline?","theme":"Adverbs","level":"A2","step":1,"note":"when, where, why, how","legacy":"word::interrogative adverb"},{"type":"pattern","text":"relative adverb","meaning":"An adverb connecting information about a place, time or reason.","example":"The office where I work is in London.","theme":"Adverbs","level":"B1","step":1,"note":"where, when, why","legacy":"word::relative adverb"},{"type":"pattern","text":"conjunctive adverb","meaning":"An adverb connecting ideas across clauses or sentences.","example":"However, we need more funds.","theme":"Adverbs","level":"B2","step":1,"note":"however, therefore, moreover, consequently","legacy":"word::conjunctive adverb"},{"type":"collocation","text":"exposed to","meaning":"In contact with or affected by something.","example":"The plants were exposed to direct sunlight.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"TO","legacy":"collocation::exposed to"},{"type":"collocation","text":"be used to","meaning":"Be familiar and comfortable with something through experience.","example":"I am used to working late.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"Be used to + noun or -ing means be familiar with something. Used to + base verb describes a past habit.","legacy":"collocation::used to"},{"type":"collocation","text":"opposed to","meaning":"Against an idea or action.","example":"We are opposed to this cut.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"TO","legacy":"collocation::opposed to"},{"type":"collocation","text":"married to","meaning":"Joined to someone in marriage.","example":"She is married to a teacher.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"TO","legacy":"collocation::married to"},{"type":"collocation","text":"addicted to","meaning":"Unable to stop using or doing something harmful or strongly habit-forming.","example":"The character in the story is addicted to gambling.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"TO","legacy":"collocation::addicted to"},{"type":"collocation","text":"attached to","meaning":"Emotionally close to someone or something.","example":"He is attached to his family.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"TO","legacy":"collocation::attached to"},{"type":"collocation","text":"committed to","meaning":"Determined to support a goal or responsibility.","example":"We are committed to our mission.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"TO","legacy":"collocation::committed to"},{"type":"collocation","text":"connected to","meaning":"Linked to something.","example":"I am connected to local partners.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"TO","legacy":"collocation::connected to"},{"type":"collocation","text":"invested in","meaning":"Deeply interested in and committed to something.","example":"We are invested in the community.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"IN","legacy":"collocation::invested in"},{"type":"collocation","text":"skilled in","meaning":"Having ability or training in something.","example":"I am skilled in case management.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"IN","legacy":"collocation::skilled in"},{"type":"collocation","text":"engaged in","meaning":"Actively taking part in something.","example":"I am engaged in advocacy.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"IN","legacy":"collocation::engaged in"},{"type":"collocation","text":"involved in","meaning":"Taking part in or connected with something.","example":"I am involved in the project.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"IN","legacy":"collocation::involved in"},{"type":"collocation","text":"confident in","meaning":"Trusting the ability of someone or something.","example":"I am confident in our team.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"IN","legacy":"collocation::confident in"},{"type":"collocation","text":"interested in","meaning":"Wanting to know or learn more about something.","example":"I am interested in the program.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"IN","legacy":"collocation::interested in"},{"type":"collocation","text":"focused on","meaning":"Giving attention to something.","example":"I am focused on results.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"ON","legacy":"collocation::focused on"},{"type":"collocation","text":"based on","meaning":"Using something as a foundation or source.","example":"I am based on the needs assessment.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"ON","legacy":"collocation::based on"},{"type":"collocation","text":"reliant on","meaning":"Depending on something.","example":"I am reliant on grants.","theme":"Adjectives and prepositions","level":"B2","step":3,"note":"ON","legacy":"collocation::reliant on"},{"type":"collocation","text":"decide on","meaning":"Choose a particular option.","example":"We decided on a date.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"In this example, the verb is in the past tense. It is not an adjective.","legacy":"collocation::decided on"},{"type":"collocation","text":"rely on","meaning":"Depend on or trust someone or something.","example":"We relied on volunteers.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"In this example, the verb is in the past tense. It is not an adjective.","legacy":"collocation::relied on"},{"type":"collocation","text":"agree on","meaning":"Reach a shared decision.","example":"We agreed on the budget.","theme":"Verbs and prepositions","level":"B1","step":1,"note":"In this example, the verb is in the past tense. It is not an adjective.","legacy":"collocation::agreed on"},{"type":"collocation","text":"thankful for","meaning":"Feeling appreciation for something.","example":"I am thankful for your support.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"FOR","legacy":"collocation::thankful for"},{"type":"collocation","text":"grateful for","meaning":"Feeling deep appreciation for something.","example":"I am grateful for the funding.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"FOR","legacy":"collocation::grateful for"},{"type":"collocation","text":"famous for","meaning":"Widely recognized because of something.","example":"The town is famous for its music festival.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"FOR","legacy":"collocation::famous for"},{"type":"collocation","text":"responsible for","meaning":"Having a duty to deal with something.","example":"I am responsible for the caseload.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"FOR","legacy":"collocation::responsible for"},{"type":"collocation","text":"ready for","meaning":"Prepared for something.","example":"I am ready for the meeting.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"FOR","legacy":"collocation::ready for"},{"type":"collocation","text":"known for","meaning":"Recognized because of a particular quality or activity.","example":"The centre is known for its language workshops.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"FOR","legacy":"collocation::known for"},{"type":"collocation","text":"shocked at","meaning":"Very surprised and upset by something.","example":"I am shocked at the news.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"AT","legacy":"collocation::shocked at"},{"type":"collocation","text":"frustrated at","meaning":"Annoyed because progress is difficult or delayed.","example":"I am frustrated at the delay.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"AT","legacy":"collocation::frustrated at"},{"type":"collocation","text":"surprised at","meaning":"Feeling that something was unexpected.","example":"I am surprised at the result.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"AT","legacy":"collocation::surprised at"},{"type":"collocation","text":"good at","meaning":"Skilled in an activity.","example":"I am good at writing grants.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"AT","legacy":"collocation::good at"},{"type":"collocation","text":"bad at","meaning":"Finding an activity difficult or performing it poorly.","example":"I used to think I was bad at maths.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"AT","legacy":"collocation::bad at"},{"type":"collocation","text":"convinced of","meaning":"Certain that something is true or valuable.","example":"I am convinced of its value.","theme":"Adjectives and prepositions","level":"B2","step":3,"note":"OF","legacy":"collocation::convinced of"},{"type":"collocation","text":"aware of","meaning":"Knowing about something.","example":"I am aware of the risks.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"OF","legacy":"collocation::aware of"},{"type":"collocation","text":"capable of","meaning":"Having the ability to do something.","example":"I am capable of leading.","theme":"Adjectives and prepositions","level":"B1","step":3,"note":"OF","legacy":"collocation::capable of"},{"type":"collocation","text":"proud of","meaning":"Pleased about an achievement or a person.","example":"I am proud of our team.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"OF","legacy":"collocation::proud of"},{"type":"collocation","text":"afraid of","meaning":"Feeling fear about something.","example":"I am afraid of failure.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"OF","legacy":"collocation::afraid of"},{"type":"collocation","text":"tired of","meaning":"Annoyed or bored with something that continues.","example":"I am tired of waiting.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"OF","legacy":"collocation::tired of"},{"type":"collocation","text":"fond of","meaning":"Liking someone or something.","example":"I am fond of music.","theme":"Adjectives and prepositions","level":"A2","step":3,"note":"OF","legacy":"collocation::fond of"},{"type":"pattern","text":"personal pronouns","meaning":"Pronouns referring to people or things, such as I, you and they.","example":"I met her yesterday.","theme":"Pronouns","level":"A2","step":1,"note":"Examples: I, you, he, she, it, we, they","legacy":"word::personal"},{"type":"pattern","text":"possessive pronouns","meaning":"Pronouns showing ownership, such as mine and yours.","example":"This file is mine.","theme":"Pronouns","level":"A2","step":1,"note":"Examples: mine, yours, his, hers, ours, theirs","legacy":"word::possessive"},{"type":"pattern","text":"reflexive pronouns","meaning":"Pronouns referring back to the subject, such as myself.","example":"She helped herself.","theme":"Pronouns","level":"A2","step":1,"note":"Examples: myself, yourself, himself, themselves","legacy":"word::reflexive"},{"type":"pattern","text":"demonstrative pronouns","meaning":"Pronouns pointing to things, such as this and those.","example":"These are our priorities.","theme":"Pronouns","level":"A2","step":1,"note":"Examples: this, that, these, those","legacy":"word::demonstrative"},{"type":"pattern","text":"interrogative pronouns","meaning":"Pronouns used to ask questions, such as who and which.","example":"Which program do you prefer?","theme":"Pronouns","level":"A2","step":1,"note":"Examples: who, whom, whose, which, what","legacy":"word::interrogative"},{"type":"pattern","text":"relative pronouns","meaning":"Pronouns connecting a noun to more information about it.","example":"The person who called yesterday left a message.","theme":"Pronouns","level":"B1","step":1,"note":"Examples: who, whom, whose, which, that","legacy":"word::relative"},{"type":"pattern","text":"indefinite pronouns","meaning":"Pronouns referring to unspecified people or things.","example":"Nobody called.","theme":"Pronouns","level":"A2","step":1,"note":"Examples: someone, anything, everybody, nothing","legacy":"word::indefinite"},{"type":"pattern","text":"distributive pronouns","meaning":"Words referring to individual members or choices within a group.","example":"Each received a message.","theme":"Pronouns","level":"B1","step":1,"note":"Each, either and neither can stand alone as pronouns or appear before a noun as determiners.","legacy":"word::distributive"},{"type":"pattern","text":"reciprocal pronouns","meaning":"Pronouns expressing an action shared between people.","example":"They help each other.","theme":"Pronouns","level":"B1","step":1,"note":"Examples: each other, one another","legacy":"word::reciprocal"},{"type":"pattern","text":"intensive pronouns","meaning":"Pronouns adding emphasis to the person doing an action.","example":"I did it myself.","theme":"Pronouns","level":"B2","step":1,"note":"Examples: myself, herself (emphasis)","legacy":"word::intensive"},{"type":"expr","text":"because","meaning":"Introduces a reason.","example":"We applied because we need funds.","theme":"Connect your ideas","level":"A2","step":1,"note":"","legacy":"expr::because"},{"type":"expr","text":"although","meaning":"Introduces a fact that contrasts with another fact.","example":"Although it was hard, we succeeded.","theme":"Connect your ideas","level":"A2","step":1,"note":"","legacy":"expr::although"},{"type":"expr","text":"unless","meaning":"Except if a particular condition happens.","example":"We will meet outside unless it rains.","theme":"Connect your ideas","level":"B1","step":1,"note":"","legacy":"expr::unless"},{"type":"expr","text":"or","meaning":"Introduces another possibility or choice.","example":"Do you prefer tea or coffee?","theme":"Connect your ideas","level":"A1","step":1,"note":"","legacy":"expr::or"},{"type":"expr","text":"when","meaning":"At the time that something happens.","example":"When I arrived, they left.","theme":"Connect your ideas","level":"A1","step":1,"note":"","legacy":"expr::when"},{"type":"expr","text":"since","meaning":"From a past time until now; also because.","example":"Since you ask, I will answer.","theme":"Connect your ideas","level":"A2","step":1,"note":"","legacy":"expr::since"},{"type":"expr","text":"until","meaning":"Up to the time when something happens.","example":"Wait until I call.","theme":"Connect your ideas","level":"A2","step":1,"note":"","legacy":"expr::until"},{"type":"expr","text":"if","meaning":"Introduces a condition or possibility.","example":"If we get the grant, we will hire.","theme":"Connect your ideas","level":"A1","step":1,"note":"","legacy":"expr::if"},{"type":"expr","text":"before","meaning":"Earlier than another action or event.","example":"Call me before you go.","theme":"Connect your ideas","level":"A1","step":1,"note":"","legacy":"expr::before"},{"type":"expr","text":"so","meaning":"Introduces a result or consequence.","example":"It was late, so we left.","theme":"Connect your ideas","level":"A1","step":1,"note":"","legacy":"expr::so"},{"type":"expr","text":"and","meaning":"Connects two items or ideas.","example":"We plan and deliver.","theme":"Connect your ideas","level":"A1","step":1,"note":"","legacy":"expr::and"},{"type":"expr","text":"but","meaning":"Introduces a contrast.","example":"We tried, but failed.","theme":"Connect your ideas","level":"A1","step":1,"note":"","legacy":"expr::but"},{"type":"expr","text":"therefore","meaning":"As a logical result; for that reason.","example":"Therefore, we need more support.","theme":"Connect your ideas","level":"B2","step":1,"note":"Linking adverb: use appropriate punctuation, such as starting a separate sentence.","legacy":"expr::therefore"},{"type":"expr","text":"while","meaning":"During the time that; also introduces a contrast.","example":"While I work, he studies.","theme":"Connect your ideas","level":"A2","step":1,"note":"","legacy":"expr::while"},{"type":"expr","text":"yet","meaning":"Despite that; introduces a contrast.","example":"Small yet powerful.","theme":"Connect your ideas","level":"A2","step":1,"note":"","legacy":"expr::yet"},{"type":"expr","text":"whereas","meaning":"Used to contrast two facts.","example":"Some agree, whereas others don't.","theme":"Connect your ideas","level":"B2","step":1,"note":"","legacy":"expr::whereas"},{"type":"expr","text":"moreover","meaning":"Adds another supporting point.","example":"Moreover, the cost is low.","theme":"Connect your ideas","level":"B2","step":1,"note":"","legacy":"expr::moreover"},{"type":"expr","text":"however","meaning":"Introduces a contrast with the previous idea.","example":"However, we must be careful.","theme":"Connect your ideas","level":"B1","step":1,"note":"Linking adverb: However can start a new sentence.","legacy":"expr::however"},{"type":"word","text":"nowadays","meaning":"At the present time, compared with the past.","example":"Nowadays, many families need help.","theme":"Time and frequency","level":"B1","step":5,"note":"","legacy":"word::nowadays"},{"type":"word","text":"instantly","meaning":"Immediately, without delay.","example":"The message was delivered instantly.","theme":"Time and wordCard=function(w){var saved=!!S.bank[w.key],c=contextFor(w),others=w.contexts.filter(x=>x!==c);return '<article class="word-card"><div class="flex between"><div class="term" lang="en">'+esc(w.text)+'</div><div class="word-actions"><button class="icon-button" aria-label="Listen '+esc(w.text)+'" onclick="listenWord('+w.id+')">♫</button><button class="icon-button" aria-label="'+(saved?'Remove from':'Add to')+' favourites" aria-pressed="'+saved+'" onclick="toggleWord('+w.id+',this)">'+(saved?'★':'☆')+'</button></div></div>'+contextHTML(c,w.id)+(c.example?'<button class="text-button" onclick="listenExample('+w.id+')">♫ Listen to the example</button>':'')+(others.length?'<details class="contexts"><summary>'+others.length+' other context'+(others.length>1?'s':'')+' and examples</summary>'+others.map((x,i)=>contextHTML(x,w.id)).join('')+'</details>':'')+'</article>';};
function listenWord(i){var w=wordBank[i];speakEn(w.text.replace(/\s*·.*$/,'').replace(/\s*\([^)]*\)/g,''));}
function listenExample(i){speakEn(contextFor(wordBank[i]).example);}
toggleWord=function(i,btn){var w=wordBank[i];if(S.bank[w.key])delete S.bank[w.key];else S.bank[w.key]={type:w.type,text:w.text,extra:w.meaning,date:localDay()};sauver();if(btn){var on=!!S.bank[w.key];btn.textContent=on?'★':'☆';btn.setAttribute('aria-pressed',String(on));btn.setAttribute('aria-label',on?'Remove from favourites':'Add to favourites');var count=document.getElementById('favCount');if(count)count.textContent='('+bankCount()+')';}else render();};
function reviewDate(days){var d=new Date();d.setDate(d.getDate()+days);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function recordRecall(key,known){var prev=S.reviewSchedule[key]||{streak:0,count:0},streak=known?Math.min(prev.streak+(prev.last===localDay()&&prev.streak>0?0:1),5):0;S.reviewSchedule[key]={streak:streak,count:prev.count+1,last:localDay(),due:reviewDate(known?[0,1,3,7,14,30][streak]:0)};S.knownWords[key]=known;}

renderMyBank=function(){migrateWords();var html=oldBankView();return html.replace('<div class="flex wrap" style="margin-bottom:20px">','<div class="flex wrap" style="margin-bottom:20px"><button class="btn btn-or" onclick="openStudy(null,\'saved\')">A session with my favourites</button>');};

renderHome=function(){var html=previousHome(),panel=studyPanel();return html.replace('<div class="section-line">',panel+'<div class="section-line">');};
function studyPanel(){var a=S.activeSession,active=a&&!a.finished,due=dueWords().length;return '<section class="session-banner"><div><span class="sur">'+(active?'Your session is waiting':'My time for English')+'</span><h2>'+(active?'Pick up where I left off.':'A short session. A real step forward.')+'</h2><p>'+(active?a.index+' / '+a.keys.length+' cards practised. Your progress is saved.':S.minutes+' minutes at your pace · discover, listen, remember and try a sentence.')+'</p>'+(due?'<span class="badge gold">'+due+' card'+(due>1?'s':'')+' to review</span>':'')+'</div><div class="session-cta"><button class="btn btn-marine" onclick="openStudy()">'+(active?'Continue my session':'Start my session')+' →</button><button class="text-button" onclick="openStudy(null,\'due\')">Choose my review</button></div></section>';}

function openStudy(step,source){stopAudio();if(S.activeSession&&S.activeSession.finished)S.activeSession=null;sessionReveal=false;sessionStep=Number.isInteger(step)?step:(!S.sessionHistory.length?(S.goal==='work'?4:S.goal==='confidence'?3:0):S.sessionStep);sessionSource=source||'path';sessionLevel=S.niveau;S.tab='learn';S.sub='study';S.pathId=null;S.revId=null;S.situId=null;S.screen='app';render();window.scrollTo(0,0);}
function studyPool(step,level,source){var rank=LEVELS.indexOf(level);return wordBank.filter(w=>w.contexts.some(c=>(source==='path'?c.step===step:true)&&LEVELS.indexOf(c.level)<=rank)&&(source==='saved'?!!S.bank[w.key]:source==='due'?isDue(w):true));}
var studySeeds=[['How’s it going?','How\'s it going?',"You're welcome / My pleasure",'Excuse me / Sorry','What time is it?','Sounds good!','look at','listen to','ask for','get up'],['I would like…','look for','wait for','because','and','but','first','then','at the moment','present simple'],['Excuse me, how do I get to…?','go straight','turn left / turn right',"I'm lost.",'an appointment','the wifi password','Text me!','on time'],['happy','sad','tired','confident','worried','proud of','good at','hang in there'],['full-time / part-time','skills','a resume','a cover letter','a shift','to hire','a deadline','follow up'],['find out','go over','look forward to','get = understand','in other words','actually','eventually']];
function seedRank(w,step){var seed=studySeeds[step].map(termKey).indexOf(termKey(w.text));return seed<0?999:seed;}
function plannedWords(step,level,source){var pool=studyPool(step,level,source);return pool.sort((a,b)=>{
 var ra=S.reviewSchedule[a.key],rb=S.reviewSchedule[b.key];
 function priority(w,r){return r?(r.due<=localDay()?0:3):1;}
 var diff=priority(a,ra)-priority(b,rb);if(diff)return diff;
 if(ra&&rb&&ra.due!==rb.due)return ra.due.localeCompare(rb.due);
 return seedRank(a,step)-seedRank(b,step)||LEVELS.indexOf(a.level)-LEVELS.indexOf(b.level)||a.id-b.id;
});}
function renderStudy(){
 var a=S.activeSession;
 if(a&&!a.finished)return renderStudyCards(a);
 if(a&&a.finished)return renderStudySummary(a);
 var pool=plannedWords(sessionStep,sessionLevel||S.niveau,sessionSource),size=Math.min(pool.length,{5:5,10:8,15:10,20:12}[S.minutes]);
 return '<button class="btn btn-blanc back" onclick="goTab(\'home\')">← Home</button><div class="sur">My guided session</div><h1 class="titre-vue">Today, I take a step forward.</h1><p class="note">'+S.minutes+' planned minutes, at your own pace. Listen to words, recall their meanings and prepare your own sentence.</p><div class="carte"><div class="filter-grid study-filters"><label>My selection<select id="studySource" onchange="sessionSource=this.value;render()">'+[['path','Words from a learning step'],['saved','My favourites'],['due','Words due for review']].map(x=>'<option value="'+x[0]+'" '+(sessionSource===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></label>'+(sessionSource==='path'?'<label>My learning step<select id="studyStep" onchange="sessionStep=Number(this.value);render()">'+PATHS.map((p,i)=>'<option value="'+i+'" '+(sessionStep===i?'selected':'')+'>'+(i+1)+'. '+p.title+'</option>').join('')+'</select></label>':'')+'<label>Up to suggested level<select id="studyLevel" onchange="sessionLevel=this.value;render()">'+LEVELS.map(l=>'<option '+((sessionLevel||S.niveau)===l?'selected':'')+'>'+l+'</option>').join('')+'</select></label></div>'+audioControls()+'<div class="notice">'+(size?size+' cards in this session. Words due for review come first, followed by new words.':'No cards in this selection. Choose another level or selection.')+'</div><button class="btn btn-marine" '+(!size?'disabled':'')+' onclick="startStudy()">Start these '+size+' cards →</button></div><div class="study-route"><span>01 · Recall the words</span><span>02 · Write my sentence</span><span>03 · Prepare a conversation</span></div><p class="muted">You can pause and resume on this device. Levels are guides, not official ratings.</p>';
}
function startStudy(){var keys=plannedWords(sessionStep,sessionLevel,sessionSource).slice(0,{5:5,10:8,15:10,20:12}[S.minutes]).map(w=>w.key);if(!keys.length)return;S.sessionStep=sessionStep;S.activeSession={keys:keys,index:0,ratings:[],step:sessionStep,level:sessionLevel,source:sessionSource,date:localDay(),draft:'',finished:false,shared:false};sessionReveal=false;sauver();render();}
function studyContext(w,a){return w.contexts.find(c=>(a.source!=='path'||c.step===a.step)&&LEVELS.indexOf(c.level)<=LEVELS.indexOf(a.level))||w.contexts[0];}
function renderStudyCards(a){
 if(a.index>=a.keys.length)return renderStudyPhrase(a);
 var w=wordByKey[a.keys[a.index]],c=studyContext(w,a),pct=Math.round(a.index/a.keys.length*100);
 return '<button class="btn btn-blanc back" onclick="pauseStudy()">← Pause · my session is saved</button><div class="flex between wrap"><div class="sur">My session · Card '+(a.index+1)+' of '+a.keys.length+'</div>'+audioControls()+'</div><progress class="session-progress" max="'+a.keys.length+'" value="'+a.index+'" aria-label="Cartes travaillées">'+pct+' %</progress><h1 class="titre-vue">'+(sessionReveal?'Listen. Repeat. Try it.':'Which English word comes to mind?')+'</h1><p class="note">'+(sessionReveal?'Read the context before choosing your response.':'Try to remember, or reveal the answer if the word is new.')+'</p><div class="flashcard study-card"><span class="badge">'+c.level+' · suggested · Step '+(c.step+1)+'</span><p class="recall-prompt">'+esc(c.meaning)+'</p>'+(sessionReveal?'<div class="big" lang="en">'+esc(w.text)+'</div>'+(c.example?'<p class="example" lang="en">'+esc(c.example)+'</p>':'')+(c.note?'<p class="muted">'+esc(c.note)+'</p>':'')+'<div class="flex wrap"><button class="btn btn-blanc" onclick="listenStudy(false)">♫ Listen to the word</button>'+(c.example?'<button class="btn btn-blanc" onclick="listenStudy(true)">♫ Listen to the example</button>':'')+'<button class="icon-button" aria-label="'+(S.bank[w.key]?'Remove from':'Add to')+' favourites" aria-pressed="'+!!S.bank[w.key]+'" onclick="toggleWord('+w.id+',this)">'+(S.bank[w.key]?'★':'☆')+'</button></div>':'<button class="btn btn-marine" onclick="revealStudy()">Reveal the answer</button>')+'</div>'+(sessionReveal?'<div class="grid2 compact recall-actions"><button class="btn btn-blanc" onclick="rateStudy(false)">Review again</button><button class="btn btn-marine" onclick="rateStudy(true)">I remember</button></div>':'')+'<p class="footer-note">Your response helps plan future reviews. It does not measure your language level.</p><button class="text-button" onclick="changeStudySelection()">Change selection</button>';
}
function revealStudy(){sessionReveal=true;render();window.scrollTo(0,0);}
function listenStudy(example){var a=S.activeSession,w=wordByKey[a.keys[a.index]];if(example)speakEn(studyContext(w,a).example);else listenWord(w.id);}

function changeStudySelection(){if(!confirm('Leave this session to choose another selection? Your completed reviews will stay saved.'))return;S.activeSession=null;sessionReveal=false;sauver();render();}

function renderStudyPhrase(a){return '<button class="btn btn-blanc back" onclick="pauseStudy()">← Take a break</button><div class="sur">Cards completed · My turn to speak</div><h1 class="titre-vue">A sentence for my real life.</h1><p class="note">Choose a word from the session and write a sentence in English. You can practise it with your peer.</p><div class="chips">'+a.keys.map(k=>'<span class="badge">'+esc(wordByKey[k].text)+'</span>').join('')+'</div><form class="carte" onsubmit="finishStudy(event)"><div class="field"><label for="studyPhrase">My sentence or question for my peer (optional)</label><textarea id="studyPhrase" lang="en" maxlength="2000" placeholder="Today, I would like to…" oninput="S.activeSession.draft=this.value;sauver()">'+esc(a.draft)+'</textarea><small>Your sentence is saved as written. Your peer can help you rephrase it.</small></div><button class="btn btn-marine" type="submit">Finish my session →</button></form>';}
function finishStudy(e){if(e)e.preventDefault();var a=S.activeSession;if(!a||a.finished||a.index<a.keys.length)return;var input=document.getElementById('studyPhrase');if(input)a.draft=input.value.trim();a.finished=true;a.completedAt=localDay();S.sessionHistory.push({date:localDay(),count:a.keys.length,remembered:a.ratings.filter(Boolean).length,step:a.step,phrase:a.draft});S.sessionHistory=S.sessionHistory.slice(-60);if(a.draft)S.journal.push({date:localDay(),context:'My AngloVie session',text:a.draft});S.journal=S.journal.slice(-200);suivi('seance_terminee',a.keys.length+' cards');render();}
function renderStudySummary(a){var known=a.ratings.filter(Boolean).length;return '<div class="sur">Session completed</div><h1 class="titre-vue">One more step forward in English.</h1><div class="summary"><div><strong>'+a.keys.length+'</strong><span>cards practised</span></div><div><strong>'+known+'</strong><span>I could remember</span></div><div><strong>'+(a.keys.length-known)+'</strong><span>to practise again</span></div></div><p class="note">You can review difficult words again today. Words you remember will return after gradually longer intervals.</p>'+(a.draft?'<div class="carte"><span class="sur">My sentence, saved in my journal</span><p class="personal-phrase" lang="en">'+esc(a.draft)+'</p></div>':'')+'<div class="session-banner"><div><span class="sur">From the app to conversation</span><h2>I prepare my next conversation.</h2><p>Add the words and your sentence to your peer notes, then choose when to use them.</p></div><div class="session-cta"><button class="btn btn-marine" onclick="studyToPeer()">'+(a.shared?'View my peer notes':'Prepare for my peer')+' →</button></div></div><div class="flex wrap"><button class="btn btn-blanc" onclick="newStudy()">Choose another session</button><button class="text-button" onclick="goTab(\'home\')">Back to home</button></div>';}

rd English, avoid combining a negative verb with nobody: I do not see anybody, or I see nobody."], ["REV_LECONS.5.exos.0.q", "Choose the correct comparison when one phone plan costs less than another."], ["REV_LECONS.6.pts.0", "Use the past simple with a finished, definite past time: I saw that movie yesterday. Avoid combining have seen with yesterday in this sentence."], ["REV_LECONS.6.exos.1.q", "Choose the correct sentence for living here over the last two years and still living here now."], ["REV_LECONS.7.exos.1.q", "Ask about an amount of money. Which phrase is correct?"], ["REV_LECONS.8.pts.2", "Use whose for possession: the man whose car… A preposition may come at the end of a relative clause: the programme I am talking about."], ["REV_LECONS.8.exos.1.exp", "The preposition goes with tell someone about something: the job I told you about."], ["REV_LECONS.9.exos.1.q", "Choose the correct conditional about staying home if it rains tomorrow."], ["REV_LECONS.10.pts.2", "Use be for age and many physical states: I am thirty. I am hungry. I am cold."], ["REV_LECONS.10.exos.0.q", "Choose the correct sentence for a person who is twenty-eight years old."], ["REV_LECONS.10.exos.1.q", "Choose the correct sentence about a woman with two children."], ["REV_LECONS.13.pts.0", "Compare a routine with an action happening now: I work every day. I am working right now."], ["REV_LECONS.13.exos.0.q", "On the phone, explain that a colleague is helping another customer right now."], ["REV_LECONS.13.exos.1.q", "Choose the natural sentence meaning that something is clear to you."], ["REV_LECONS.14.pts.2", "Use capitals for days, months and languages: Monday, July, English and French."], ["REV_LECONS.18.exos.1.q", "Politely ask someone to send you a document."], ["REV_LECONS.19.pts.0", "Use explain something to someone: Explain it to me. Can you explain this rule to me?"], ["REV_LECONS.20.pts.0", "Use look for when trying to find something: I am looking for a job. Search for a job is also correct; search a job is not the intended pattern."], ["REV_LECONS.20.exos.0.q", "Choose the correct sentence about trying to find an apartment."], ["REV_LECONS.22.pts.0", "Have to often describes an external requirement: I have to work Saturdays. Must can express a strong obligation, personal insistence or recommendation: You must try this restaurant. Context matters."], ["REV_LECONS.23.pts.0", "Use since with a starting point: since 2023, since Monday, since I arrived. Use for with a duration: for two years, for three months."], ["REV_LECONS.23.pts.1", "Ask yourself whether you mean a starting point or a length of time. Starting point: since. Length of time: for."], ["REV_LECONS.23.exos.1.q", "Choose the correct sentence about someone who started working here on Monday and still works here."], ["REV_LECONS.24.pts.0", "Already means something happened before now or earlier than expected: I have already finished. She is already here."], ["REV_LECONS.24.pts.1", "Yet is common in questions and negatives, often at the end: I have not received it yet. Have you eaten yet?"], ["REV_LECONS.24.pts.2", "Have you finished yet? asks about completion. Have you finished already? often suggests surprise at how soon it happened."], ["REV_LECONS.25.pts.0", "Tell commonly names the person: tell me, she told us. Say introduces the words; use to if naming the recipient: say it to him."], ["REV_LECONS.26.pts.0", "Do is used for many activities and tasks: do the dishes, do homework, do business, do your best. Learn fixed combinations with make and do."], ["REV_LECONS.26.exos.0.q", "Which expression means arranging a time to see someone?"], ["REV_LECONS.27.pts.0", "Attend means be present at an event: I attended the meeting. Wait for means stay until someone or something arrives: I am waiting for the bus."], ["REV_LECONS.27.pts.1", "Assist means help and is relatively formal: Can I assist you? Attend means be present: I am attending the meeting."], ["REV_LECONS.27.pts.2", "Actually means in fact, often correcting an idea. Currently means at present. Compare: Actually, I live in London. I am currently looking for work."], ["REV_LECONS.27.exos.1.q", "Choose the sentence meaning that you are looking for a job at the present time."], ["REV_LECONS.27.exos.1.exp", "Currently means at present. Actually means in fact."], ["SITUATIONS.0.vocab.1.1", "At a reduced price."], ["SITUATIONS.0.vocab.2.1", "The place where you pay for your shopping."], ["SITUATIONS.0.vocab.3.1", "A wheeled container / a smaller container carried by hand."], ["SITUATIONS.0.vocab.4.2", "Receipt has a silent p: ri-SEET. A recipe gives instructions for cooking."], ["SITUATIONS.0.vocab.5.1", "Foods made from milk, such as cheese and yogurt."], ["SITUATIONS.0.exos.0.exp", "On sale means available at a reduced price."], ["SITUATIONS.1.vocab.0.1", "Arrange a time to see someone."], ["SITUATIONS.1.vocab.5.2", "A prescription concerns medicine or treatment. Registration means signing up for something."], ["SITUATIONS.1.vocab.7.1", "Arrange a new time / stop a planned appointment from happening."], ["SITUATIONS.1.vocab.9.1", "The room where people sit before their appointment."], ["SITUATIONS.1.exos.1.exp", "Reschedule means arrange a different time. Cancel means stop the appointment from happening."], ["SITUATIONS.1.exos.3.exp", "A prescription is an instruction for medicine or treatment. Registration means signing up."], ["SITUATIONS.2.vocab.2.1", "What I do well / areas where I need to improve."], ["SITUATIONS.2.vocab.9.1", "Contact someone again after an earlier conversation or meeting."], ["SITUATIONS.2.exos.0.q", "What is a common North American name for a short summary of work experience and qualifications?"], ["SITUATIONS.2.exos.1.options.0", "I perform effectively when a situation is demanding."], ["SITUATIONS.3.vocab.1.1", "Please wait while staying connected to the phone call."], ["SITUATIONS.3.vocab.3.1", "Introduce the reason for your phone call."], ["SITUATIONS.3.vocab.4.1",
